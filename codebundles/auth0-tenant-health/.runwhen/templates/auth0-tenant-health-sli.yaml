apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: Health Score
  displayUnitsShort: score
  locations:
    - {{default_location}}
  description: Binary health score for the Auth0 tenant -- 1 only if service is reachable, custom domains are verified with valid certificates, and no repeated error or login-failure spikes, rate-limit signals, or inactive log streams are present; 0 otherwise.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/auth0-tenant-health/sli.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: AUTH0_TENANT
      value: {{ match_resource.resource_name | default(match_resource.qualified_name) }}
    - name: LOG_LOOKBACK_HOURS
      value: "{{ custom.log_lookback_hours | default('24') }}"
    - name: LOGIN_FAILURE_THRESHOLD
      value: "{{ custom.login_failure_threshold | default('50') }}"
    - name: RATE_LIMIT_THRESHOLD_PCT
      value: "{{ custom.rate_limit_threshold_pct | default('80') }}"
    - name: CERT_EXPIRY_WARN_DAYS
      value: "{{ custom.cert_expiry_warn_days | default('30') }}"
  secretsProvided:
  {% if wb_version %}
    {% include "auth0-auth.yaml" ignore missing %}
  {% else %}
    - name: AUTH0_MGMT_CREDENTIALS
      workspaceKey: {{ custom.auth0_mgmt_credentials | default("AUTH0_MGMT_CREDENTIALS") }}
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m