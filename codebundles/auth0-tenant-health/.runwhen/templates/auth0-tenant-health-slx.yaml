apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{ slx_name }}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/auth0/auth0.svg
  alias: {{ match_resource.resource_name }} Auth0 Tenant Service Health
  asMeasuredBy: The number of unhealthy Auth0 tenant dimensions, including service availability, custom domain health, error-log spikes, login-failure anomalies, rate-limit signals, and log-stream delivery.
  configProvided:
    - name: AUTH0_TENANT
      value: {{ match_resource.resource_name | default(match_resource.qualified_name) }}
  owners:
    - {{ workspace.owner_email }}
  statement: The Auth0 tenant should be reachable, custom domains verified and healthy, and the log stream free of actionable error, login-failure, and rate-limit signals.
  additionalContext:
    {% include "auth0-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "auth0-tags.yaml" ignore missing %}
    - name: service
      value: auth0
    - name: scope
      value: tenant
    - name: access
      value: read-only