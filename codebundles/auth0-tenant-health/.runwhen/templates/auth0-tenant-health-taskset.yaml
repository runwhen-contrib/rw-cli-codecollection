apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Checks the overall health of an Auth0 tenant by verifying service availability, custom domain health, error-log spikes, login-failure anomalies, rate-limit signals, and log-stream delivery, raising issues for any degradation.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/auth0-tenant-health/runbook.robot
  configProvided:
    - name: AUTH0_TENANT
      value: {{ match_resource.resource_name | default(match_resource.qualified_name) }}
    - name: LOG_LOOKBACK_HOURS
      value: "{{ custom.log_lookback_hours | default('24') }}"
    - name: LOGIN_FAILURE_THRESHOLD
      value: "{{ custom.login_failure_threshold | default('50') }}"
    - name: RATE_LIMIT_THRESHOLD_PCT
      value: "{{ custom.rate_limit_threshold_pct | default('80') }}"
    - name: CERT_EXPIRY_WARN_DAYS
      value: "{{ custom.cert_expiry_warn_days | default('30') }}"
  secretsProvided:
  {% if wb_version %}
    {% include "auth0-auth.yaml" ignore missing %}
  {% else %}
    - name: AUTH0_MGMT_CREDENTIALS
      workspaceKey: {{ custom.auth0_mgmt_credentials | default("AUTH0_MGMT_CREDENTIALS") }}
  {% endif %}