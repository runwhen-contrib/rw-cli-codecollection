apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/cloud_api_gateway/cloud_api_gateway.svg
  alias: GCP API Gateway Health for Project {{project.name}}
  asMeasuredBy: A weighted 0-1 score across resource states, config drift, invoker bindings, managed service, error rate, and latency for API Gateway resources in project {{project.name}}
  configProvided:
  - name: GCP_PROJECT_ID
    value: "{{project.name}}"
  owners:
  - {{workspace.owner_email}}
  statement: GCP API Gateway should deploy only ACTIVE resources, stay pinned to the newest config, hold invoker permissions on its backends, have an enabled managed service, and serve low error rates with acceptable latency.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: api_gateway
    - name: scope
      value: Project
    - name: access
      value: read-only
