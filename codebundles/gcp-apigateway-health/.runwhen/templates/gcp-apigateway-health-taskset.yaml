apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Diagnoses GCP API Gateway health -- discovers Apis, Configs and Gateways, checks resource states, config drift, the managed service, backend invoker permissions and dangling backends, analyzes error rates and latency via Cloud Monitoring, reviews failed operations, and generates a consolidated health summary for project {{project.name}}.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigateway-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: GCP_REGIONS
      value: '{{custom.gcp_regions | default("")}}'
    - name: API_NAME
      value: '{{custom.api_name | default("")}}'
    - name: API_CONFIG_NAME
      value: '{{custom.api_config_name | default("")}}'
    - name: METRIC_LOOKBACK_PERIOD
      value: '{{custom.metric_lookback_period | default("3600s")}}'
    - name: ERROR_RATE_THRESHOLD
      value: '{{custom.error_rate_threshold | default("0.01")}}'
    - name: AUTH_ERROR_RATE_THRESHOLD
      value: '{{custom.auth_error_rate_threshold | default("0.005")}}'
    - name: LATENCY_THRESHOLD_MS
      value: '{{custom.latency_threshold_ms | default("5000")}}'
    - name: LATENCY_GAP_THRESHOLD_MS
      value: '{{custom.latency_gap_threshold_ms | default("1000")}}'
    - name: OPERATIONS_LOOKBACK
      value: '{{custom.operations_lookback | default("24h")}}'
