apiVersion: runwhen.com/v1
kind: GenerationRules
spec:
  platform: gcp
  generationRules:
    # Gate on the Apigee organization, not on the project. An Apigee org is
    # one-per-project and most projects have none, so matching bare `project`
    # generated an SLX for every indexed project in the workspace.
    #
    # qualifiers: ["project"] is retained deliberately: the gate decides WHETHER
    # to generate, the qualifier keeps it one SLX per project. Same shape as the
    # other typed GCP bundles (gcp_apigateway_gateways, gcp_bigquery_datasets).
    #
    # gcp_apigee_organizations is the canonical name; apigee_organizations and
    # apigee_organization are aliases. Pin the canonical one.
    #
    # Gated on the organization rather than gcp_apigee_environments: an org with
    # zero environments still has org-level state worth reporting -- stuck
    # provisioning, non-ACTIVE, no runtime instances -- which is exactly what
    # this bundle checks. Gating on environments would hide a broken org that
    # never got as far as creating one.
    #
    # This bundle ships runbook-only: every check the SLI scored is run by a
    # runbook task (the runbook is a strict superset -- it also covers
    # southbound connectivity and instance capacity), so no data is lost. Same
    # shape as gcp-iam-role-query. Reintroduce an SLI once the scoring model has
    # been validated against real orgs over time.
    - resourceTypes:
        - gcp_apigee_organizations
      matchRules:
        - type: pattern
          pattern: ".+"
          properties: [name]
          mode: substring
      slxs:
        - baseName: gcp-apigee-environment-health
          qualifiers: ["project"]
          baseTemplateName: gcp-apigee-environment-health
          levelOfDetail: basic
          outputItems:
            - type: slx
            - type: runbook
              templateName: gcp-apigee-environment-health-taskset.yaml
