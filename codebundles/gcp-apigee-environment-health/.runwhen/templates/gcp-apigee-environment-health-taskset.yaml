apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
# Kept identical to the SLX template's chain on purpose: the two must not be
# able to disagree about which org this SLX covers. See that file for why every
# default is in boolean mode, and why _res is materialised before use rather
# than reaching through match_resource.resource.name directly.
{% set _res = match_resource.resource | default({}, true) %}
{% set apigee_org = custom.apigee_org | default(_res.name, true) | default(qualifiers.resource, true) | default(match_resource.name, true) | default('', true) %}
spec:
  location: {{default_location}}
  description: Diagnoses the northbound and southbound edges of Apigee X organization {{apigee_org}} in project {{project.name}} -- discovers org topology, checks org/env state, instance and env group attachments and hostname routing, keystore alias certificate expiry, target server reachability, VPC peering / Private Service Connect, and instance capacity / regional failover.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigee-environment-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: APIGEE_ORG
      value: '{{apigee_org}}'
    - name: ENVIRONMENTS
      value: '{{custom.environments | default("All")}}'
    - name: CERT_EXPIRY_WARNING_DAYS
      value: '{{custom.cert_expiry_warning_days | default("30")}}'
    - name: TARGET_REACHABILITY_TIMEOUT
      value: '{{custom.target_reachability_timeout | default("5")}}'
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
