version: "3"

silent: true

vars:
  codebundle: "gcp-apigee-environment-health"

tasks:
  default:
    desc: "Run discovery and template validation"
    cmds:
      - task: check-unpushed-commits
      - task: build-infra
      - task: import-keystore-alias
      - task: generate-rwl-config
      - task: run-rwl-discovery
      - task: validate-generation-rules

  clean:
    desc: "Run cleanup tasks"
    cmds:
      - task: check-and-cleanup-terraform
      - task: delete-slxs
      - task: clean-rwl-discovery

  bootstrap-prerequisites:
    desc: "OPT-IN, one-time per project: apply the Terraform prerequisites (APIs + peering) then create the Apigee org, which Terraform cannot manage"
    cmds:
      - |
        set -e
        if [ ! -f "terraform/tf.secret" ]; then
          echo "terraform/tf.secret is required. See .test/README.md for its contents."
          exit 1
        fi
        source terraform/tf.secret
        project="${TF_VAR_project_id:?TF_VAR_project_id must be set in tf.secret}"
        org="${TF_VAR_org_id:?TF_VAR_org_id must be set in tf.secret}"
        org="${org#organizations/}"
        network="${TF_VAR_network:-default}"
        region="${TF_VAR_region:-us-west1}"
        peering_disabled="${TF_VAR_disable_vpc_peering:-false}"
        api="https://apigee.googleapis.com/v1"

        # The APIs and peering range are ordinary Terraform resources, but the
        # org they enable is not -- and the rest of main.tf cannot be created
        # until the org exists. So apply just the prerequisite subset here.
        echo "==> 1/2 applying Terraform prerequisites (APIs + peering range)"
        targets="-target=google_project_service.required"
        if [ "${peering_disabled}" != "true" ]; then
          targets="${targets} -target=google_compute_global_address.apigee_peering -target=google_service_networking_connection.apigee"
        fi
        (cd terraform && terraform init -input=false && terraform apply -input=false -auto-approve ${targets})

        echo "==> 2/2 creating Apigee org '${org}' (EVALUATION)"
        token=$(gcloud auth print-access-token)
        if curl -fsS -H "Authorization: Bearer ${token}" "${api}/organizations/${org}" >/dev/null 2>&1; then
          echo "    org '${org}' already exists"
        else
          if [ "${peering_disabled}" = "true" ]; then
            body="{\"name\":\"${org}\",\"analyticsRegion\":\"${region}\",\"runtimeType\":\"CLOUD\",\"billingType\":\"EVALUATION\",\"disableVpcPeering\":true}"
          else
            body="{\"name\":\"${org}\",\"analyticsRegion\":\"${region}\",\"runtimeType\":\"CLOUD\",\"billingType\":\"EVALUATION\",\"authorizedNetwork\":\"${network}\"}"
          fi
          code=$(curl -s -o org_create.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            "${api}/organizations?parent=projects/${project}" -d "${body}")
          case "${code}" in
            200|201) echo "    creation accepted" ;;
            *) echo "ERROR: org creation failed (HTTP ${code})"; cat org_create.out; rm -f org_create.out; exit 1 ;;
          esac
          rm -f org_create.out
        fi

        echo "==> waiting for org to reach ACTIVE (~4 min for an EVALUATION org)"
        state=""
        i=0
        while [ "${i}" -lt 60 ]; do
          state=$(curl -fsS -H "Authorization: Bearer ${token}" "${api}/organizations/${org}" 2>/dev/null | jq -r '.state // ""')
          [ "${state}" = "ACTIVE" ] && break
          echo "    state=${state:-pending} ..."
          sleep 15
          i=$((i + 1))
        done
        if [ "${state}" != "ACTIVE" ]; then
          echo "ERROR: org '${org}' did not reach ACTIVE in time (last state: ${state:-unknown})"
          exit 1
        fi
        echo "Apigee org '${org}' is ACTIVE. Next: task build-infra"

  build-infra:
    desc: "Build test infrastructure (healthy + broken Apigee fixtures)"
    cmds:
      - task: generate-certs
      - task: build-terraform-infra

  generate-certs:
    desc: "Generate self-signed certificates (valid + short-dated) for keystore alias fixtures"
    vars:
      CERTS_DIR: "terraform/certs"
    cmds:
      - |
        mkdir -p {{.CERTS_DIR}}
        if [ ! -f {{.CERTS_DIR}}/apigee-valid-key.pem ]; then
          openssl req -x509 -newkey rsa:2048 \
            -keyout {{.CERTS_DIR}}/apigee-valid-key.pem \
            -out {{.CERTS_DIR}}/apigee-valid-cert.pem \
            -days 365 -nodes -subj "/CN=apigee-health-test"
        fi
        if [ ! -f {{.CERTS_DIR}}/apigee-expiring-key.pem ]; then
          openssl req -x509 -newkey rsa:2048 \
            -keyout {{.CERTS_DIR}}/apigee-expiring-key.pem \
            -out {{.CERTS_DIR}}/apigee-expiring-cert.pem \
            -days 10 -nodes -subj "/CN=apigee-health-expiring-test"
        fi

  build-terraform-infra:
    desc: "Build Terraform test resources (inner Apigee resources in the shared org)"
    dir: terraform
    cmds:
      - |
        if [ -f "tf.secret" ]; then
          source tf.secret
          terraform init
          terraform plan -out=tfplan
          terraform apply tfplan
        else
          echo "tf.secret not found. Skipping Terraform apply."
        fi

  import-keystore-alias:
    desc: "Create the default keystore and import valid + expiring alias certificates via the Apigee REST API"
    cmds:
      - |
        set -e
        if [ ! -f "terraform/tf.secret" ] || [ ! -f "gcp.json.secret" ]; then
          echo "Credentials (terraform/tf.secret and gcp.json.secret) required to import keystore aliases. Skipping."
          exit 0
        fi
        source terraform/tf.secret
        export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/gcp.json.secret"
        gcloud auth activate-service-account --key-file="$(pwd)/gcp.json.secret" 2>/dev/null || true
        token=$(gcloud auth print-access-token)
        # TF_VAR_org_id is in organizations/{org} form for the google_apigee_*
        # resources; the REST paths below need the bare org name.
        org="${TF_VAR_org_id:-${APIGEE_ORG:-}}"
        org="${org#organizations/}"
        # Must track terraform's resource_suffix, which tf.secret sets as
        # TF_VAR_resource_suffix. Reading only RESOURCE_SUFFIX meant a suffix
        # set the documented way still targeted apigee-env-healthy-test001.
        env_name="apigee-env-healthy-${TF_VAR_resource_suffix:-${RESOURCE_SUFFIX:-test001}}"
        api="https://apigee.googleapis.com/v1"
        keystore="default"

        # Apigee does NOT provision a keystore implicitly and nothing else here
        # creates one, so the alias uploads below 404 without this. 409 means it
        # already exists, which is fine on a re-run.
        code=$(curl -s -o ks_create.out -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${token}" \
          -H "Content-Type: application/json" \
          --data "{\"name\":\"${keystore}\"}" \
          "${api}/organizations/${org}/environments/${env_name}/keystores")
        case "${code}" in
          200|201|409) echo "keystore '${keystore}': ready (HTTP ${code})" ;;
          *) echo "ERROR: could not create keystore '${keystore}' (HTTP ${code})"; cat ks_create.out; rm -f ks_create.out; exit 1 ;;
        esac
        rm -f ks_create.out

        # alias and format are QUERY parameters, and the body is
        # multipart/form-data -- not a JSON body with a base64 blob. The parts
        # must be named certFile and keyFile; two parts both named `file` are
        # rejected with "multipart body contained duplicate part name".
        # ignoreExpiryValidation lets the deliberately short-dated fixture
        # upload even once it has lapsed.
        for spec in "apigee-alias-valid:apigee-valid" "apigee-alias-expiring:apigee-expiring"; do
          alias_name="${spec%%:*}"
          cert_base="${spec##*:}"
          code=$(curl -s -o alias_create.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" \
            -F "certFile=@terraform/certs/${cert_base}-cert.pem" \
            -F "keyFile=@terraform/certs/${cert_base}-key.pem" \
            "${api}/organizations/${org}/environments/${env_name}/keystores/${keystore}/aliases?alias=${alias_name}&format=keycertfile&ignoreExpiryValidation=true")
          case "${code}" in
            200|201) echo "alias '${alias_name}': created" ;;
            409) echo "alias '${alias_name}': already exists" ;;
            *) echo "ERROR: could not create alias '${alias_name}' (HTTP ${code})"; cat alias_create.out; rm -f alias_create.out; exit 1 ;;
          esac
        done
        rm -f alias_create.out

        # Prove the fixture actually landed, so a silent no-op can never again
        # be mistaken for a clean keystore dimension.
        aliases=$(curl -fsS -H "Authorization: Bearer ${token}" \
          "${api}/organizations/${org}/environments/${env_name}/keystores/${keystore}" | jq -r '.aliases // [] | join(", ")')
        if [ -z "${aliases}" ]; then
          echo "ERROR: keystore '${keystore}' reports no aliases after import; the cert expiry scenario would be untested."
          exit 1
        fi
        echo "keystore '${keystore}' aliases: ${aliases}"

  check-and-cleanup-terraform:
    desc: "Destroy Terraform resources"
    dir: terraform
    cmds:
      - |
        if [ -f "terraform.tfstate" ]; then
          source tf.secret
          terraform destroy -auto-approve
        fi

  check-unpushed-commits:
    desc: "Check for uncommitted/unpushed changes before testing"
    vars:
      BASE_DIR: "../"
    cmds:
      - |
        UNCOMMITTED_FILES=$(git diff --name-only HEAD | grep -E "^${BASE_DIR}(\.runwhen|[^/]+)" | grep -v "/\.test/" || true)
        if [ -n "$UNCOMMITTED_FILES" ]; then
          echo "Uncommitted changes found:"
          echo "$UNCOMMITTED_FILES"
          echo "Remember to commit & push changes before executing the run-rwl-discovery task."
          exit 1
        else
          echo "No uncommitted changes in specified directories."
        fi
      - |
        git fetch origin
        UNPUSHED_FILES=$(git diff --name-only origin/$(git rev-parse --abbrev-ref HEAD) HEAD | grep -E "^${BASE_DIR}(\.runwhen|[^/]+)" | grep -v "/\.test/" || true)
        if [ -n "$UNPUSHED_FILES" ]; then
          echo "Unpushed commits found:"
          echo "$UNPUSHED_FILES"
          echo "Remember to push changes before executing the run-rwl-discovery task."
          exit 1
        else
          echo "No unpushed commits in specified directories."
        fi

  generate-rwl-config:
    desc: "Generate RunWhen Local configuration (workspaceInfo.yaml)"
    env:
      GCP_PROJECT_ID: "{{.GCP_PROJECT_ID}}"
      RW_WORKSPACE: '{{.RW_WORKSPACE | default "my-workspace"}}'
    cmds:
      - |
        repo_url=$(git config --get remote.origin.url)
        branch_name=$(git rev-parse --abbrev-ref HEAD)
        codebundle=$(basename "$(dirname "$PWD")")

        cat <<EOF > workspaceInfo.yaml
        workspaceName: "$RW_WORKSPACE"
        workspaceOwnerEmail: authors@runwhen.com
        defaultLocation: location-01-us-west1
        defaultLOD: detailed
        writeWorkspaceFilesToDisk: true
        cloudConfig:
          gcp:
            applicationCredentialsFile: /shared/gcp.json.secret
            projects:
            - $GCP_PROJECT_ID
            projectLevelOfDetails:
              $GCP_PROJECT_ID: detailed
        codeCollections:
        - repoURL: "$repo_url"
          branch: "$branch_name"
          codeBundles: ["$codebundle"]
        EOF

  run-rwl-discovery:
    desc: "Run RunWhen Local Discovery on test infrastructure"
    cmds:
      - |
        CONTAINER_NAME="RunWhenLocal"
        if docker ps -q --filter "name=$CONTAINER_NAME" | grep -q .; then
          echo "Stopping and removing existing container $CONTAINER_NAME..."
          docker stop $CONTAINER_NAME && docker rm $CONTAINER_NAME
        elif docker ps -a -q --filter "name=$CONTAINER_NAME" | grep -q .; then
          echo "Removing existing stopped container $CONTAINER_NAME..."
          docker rm $CONTAINER_NAME
        else
          echo "No existing container named $CONTAINER_NAME found."
        fi

        sudo rm -rf output || { echo "Failed to remove output directory"; exit 1; }
        mkdir output && chmod 777 output || { echo "Failed to set permissions"; exit 1; }

        docker run --name $CONTAINER_NAME -p 8081:8081 -v "$(pwd)":/shared -d ghcr.io/runwhen-contrib/runwhen-local:latest || {
          echo "Failed to start container"; exit 1;
        }

        docker exec -w /workspace-builder $CONTAINER_NAME ./run.sh $1 --verbose || {
          echo "Error executing script in container"; exit 1;
        }

        echo "Review generated config files under output/workspaces/"

  validate-generation-rules:
    desc: "Validate YAML files in .runwhen/generation-rules"
    cmds:
      - |
        for cmd in curl yq ajv; do
          if ! command -v $cmd &> /dev/null; then
            echo "Error: $cmd is required but not installed."
            exit 1
          fi
        done

        temp_dir=$(mktemp -d)
        curl -s -o "$temp_dir/generation-rule-schema.json" https://raw.githubusercontent.com/runwhen-contrib/runwhen-local/refs/heads/main/src/generation-rule-schema.json

        for yaml_file in ../.runwhen/generation-rules/*.yaml; do
          echo "Validating $yaml_file"
          json_file="$temp_dir/$(basename "${yaml_file%.*}.json")"
          yq -o=json "$yaml_file" > "$json_file"
          ajv validate -s "$temp_dir/generation-rule-schema.json" -d "$json_file" --spec=draft2020 --strict=false \
          && echo "$yaml_file is valid." || echo "$yaml_file is invalid."
        done

        rm -rf "$temp_dir"

  check-rwp-config:
    desc: "Check if env vars are set for RunWhen Platform"
    cmds:
      - |
        missing_vars=()
        if [ -z "$RW_WORKSPACE" ]; then missing_vars+=("RW_WORKSPACE"); fi
        if [ -z "$RW_API_URL" ]; then missing_vars+=("RW_API_URL"); fi
        if [ -z "$RW_PAT" ]; then missing_vars+=("RW_PAT"); fi
        if [ ${#missing_vars[@]} -ne 0 ]; then
          echo "The following required environment variables are missing: ${missing_vars[*]}"
          exit 1
        fi

  upload-slxs:
    desc: "Upload SLX files to the appropriate URL"
    env:
      RW_WORKSPACE: "{{.RW_WORKSPACE}}"
      RW_API_URL: "{{.RW_API}}"
      RW_PAT: "{{.RW_PAT}}"
    cmds:
      - task: check-rwp-config
      - |
        BASE_DIR="output/workspaces/${RW_WORKSPACE}/slxs"
        if [ ! -d "$BASE_DIR" ]; then
          echo "Directory $BASE_DIR does not exist. Upload aborted."
          exit 1
        fi

        for dir in "$BASE_DIR"/*; do
          if [ -d "$dir" ]; then
            SLX_NAME=$(basename "$dir")
            PAYLOAD=$(jq -n --arg commitMsg "Creating new SLX $SLX_NAME" '{ commitMsg: $commitMsg, files: {} }')
            for file in slx.yaml runbook.yaml sli.yaml; do
              if [ -f "$dir/$file" ]; then
                CONTENT=$(cat "$dir/$file")
                PAYLOAD=$(echo "$PAYLOAD" | jq --arg fileContent "$CONTENT" --arg fileName "$file" '.files[$fileName] = $fileContent')
              fi
            done

            URL="https://${RW_API_URL}/api/v3/workspaces/${RW_WORKSPACE}/branches/main/slxs/${SLX_NAME}"
            echo "Uploading SLX: $SLX_NAME to $URL"
            response=$(curl -v -X POST "$URL" \
              -H "Authorization: Bearer $RW_PAT" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" -w "%{http_code}" -o /dev/null -s 2>&1)

            if [[ "$response" =~ 200|201 ]]; then
              echo "Successfully uploaded SLX: $SLX_NAME to $URL"
            else
              echo "Failed to upload SLX: $SLX_NAME to $URL. Response:"
              echo "$response"
            fi
          fi
        done

  delete-slxs:
    desc: "Delete SLX objects from the appropriate URL"
    env:
      RW_WORKSPACE: '{{.RW_WORKSPACE | default "my-workspace"}}'
      RW_API_URL: "{{.RW_API}}"
      RW_PAT: "{{.RW_PAT}}"
    cmds:
      - task: check-rwp-config
      - |
        BASE_DIR="output/workspaces/${RW_WORKSPACE}/slxs"
        if [ ! -d "$BASE_DIR" ]; then
          echo "Directory $BASE_DIR does not exist. Deletion aborted."
          exit 1
        fi

        for dir in "$BASE_DIR"/*; do
          if [ -d "$dir" ]; then
            SLX_NAME=$(basename "$dir")
            URL="https://${RW_API_URL}/api/v3/workspaces/${RW_WORKSPACE}/branches/main/slxs/${SLX_NAME}"
            echo "Deleting SLX: $SLX_NAME from $URL"
            response=$(curl -v -X DELETE "$URL" \
              -H "Authorization: Bearer $RW_PAT" \
              -H "Content-Type: application/json" -w "%{http_code}" -o /dev/null -s 2>&1)

            if [[ "$response" =~ 200|204 ]]; then
              echo "Successfully deleted SLX: $SLX_NAME from $URL"
            else
              echo "Failed to delete SLX: $SLX_NAME from $URL. Response:"
              echo "$response"
            fi
          fi
        done

  clean-rwl-discovery:
    desc: "Clean up RunWhen Local discovery output"
    cmds:
      - |
        sudo rm -rf output
        rm -f workspaceInfo.yaml
