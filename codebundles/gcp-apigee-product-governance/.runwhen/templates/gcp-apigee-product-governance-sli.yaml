apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: Health Score
  displayUnitsShort: ''
  locations:
    - {{default_location}}
  description: Health score (0-1) for the Apigee product/developer governance layer -- averages binary scores for product access-control and quota, consumer-key expiry, orphaned/unused entitlements, and developer status / dangling references.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigee-product-governance/sli.robot
  intervalStrategy: intermezzo
  # 1 hour, not the usual 600s. This SLI scores configuration drift -- API
  # product approval settings, quotas, consumer-key expiry, developer status --
  # which changes on human timescales, so a finer interval buys no freshness.
  #
  # It does buy Apigee management API calls. Each cycle costs 9 calls against a
  # project with an Apigee organization and 4 against one without, and the rule
  # currently generates an SLX for EVERY project (see the generation rule's
  # INTERIM note), so most of that spend lands on projects with no Apigee at
  # all. At 600s a 50-project workspace with one Apigee org issued roughly
  # 29.5k calls/day; at 3600s it is roughly 4.9k.
  #
  # Consumer-key expiry, the most time-sensitive check here, warns
  # KEY_EXPIRY_WARNING_DAYS ahead (default 30 days), so hourly sampling detects
  # it with days to spare.
  intervalSeconds: 3600
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: APIGEE_ORG
      value: "{{ custom.APIGEE_ORG | default('') }}"
    - name: APIPRODUCTS
      value: "{{ custom.APIPRODUCTS | default('All') }}"
    - name: DEVELOPER_APPS
      value: "{{ custom.DEVELOPER_APPS | default('All') }}"
    - name: KEY_EXPIRY_WARNING_DAYS
      value: "{{ custom.KEY_EXPIRY_WARNING_DAYS | default('30') }}"
    - name: USAGE_LOOKBACK_DAYS
      value: "{{ custom.USAGE_LOOKBACK_DAYS | default('30') }}"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m
