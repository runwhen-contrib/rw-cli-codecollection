apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
# Kept identical to the SLX template's chain on purpose: the two must not be
# able to disagree about which org this SLX covers. See that file for why every
# default is in boolean mode, and why _res is materialised before use rather
# than reaching through match_resource.resource.name directly.
{% set _res = match_resource.resource | default({}, true) %}
{% set apigee_org = custom.apigee_org | default(_res.name, true) | default(qualifiers.resource, true) | default(match_resource.name, true) | default('', true) %}
spec:
  location: {{default_location}}
  description: Governs the consumer-side entitlement layer of Apigee X organization {{apigee_org}} in project {{project.name}} -- flags auto-approval and missing quota on API products, expiring and expired developer-app consumer keys, orphaned and unused entitlements, and developer status / dangling product-reference drift.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigee-product-governance/runbook.robot
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: APIGEE_ORG
      value: '{{apigee_org}}'
    - name: APIPRODUCTS
      value: "{{ custom.APIPRODUCTS | default('All') }}"
    - name: DEVELOPER_APPS
      value: "{{ custom.DEVELOPER_APPS | default('All') }}"
    - name: KEY_EXPIRY_WARNING_DAYS
      value: "{{ custom.KEY_EXPIRY_WARNING_DAYS | default('30') }}"
    - name: USAGE_LOOKBACK_DAYS
      value: "{{ custom.USAGE_LOOKBACK_DAYS | default('30') }}"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
