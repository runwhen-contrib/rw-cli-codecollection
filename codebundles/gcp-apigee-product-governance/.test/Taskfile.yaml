version: "3"

silent: true

vars:
  codebundle: "gcp-apigee-product-governance"

tasks:
  default:
    desc: "Run the offline suite, then discovery and template validation"
    cmds:
      - task: test-offline
      - task: validate-generation-rules
      - task: check-unpushed-commits
      - task: build-infra
      - task: generate-rwl-config
      - task: run-rwl-discovery

  test-offline:
    desc: "Offline check-logic tests. No credentials, no cloud, no network -- safe to gate every PR."
    cmds:
      - bash offline/run-offline-tests.sh

  test-live:
    desc: "Run every check against the shared test org (needs terraform/tf.secret)"
    cmds:
      - |
        set -e
        . ./load-credentials.sh
        bash validate-all-tests.sh

  clean:
    desc: "Run cleanup tasks"
    cmds:
      - task: check-and-cleanup-fixtures
      - task: delete-slxs
      - task: clean-rwl-discovery

  build-infra:
    desc: "Create test fixtures (healthy + deliberately broken Apigee entitlements)"
    cmds:
      - task: create-entitlement-fixtures

  create-entitlement-fixtures:
    desc: "Provision API products, developers and apps (incl. broken cases) via the management REST API"
    cmds:
      # Fixture provisioning must fail loudly: silently skipping it leaves the
      # later tasks running against an org with nothing under test.
      - |
        set -e
        . ./load-credentials.sh
        bash fixtures/create_entitlement_fixtures.sh

  check-and-cleanup-fixtures:
    desc: "Remove the test fixtures created for this bundle and verify none survive"
    cmds:
      - |
        set -e
        . ./load-credentials.sh
        bash fixtures/delete_entitlement_fixtures.sh

  check-and-cleanup-terraform:
    desc: "Alias for check-and-cleanup-fixtures, matching the sibling Apigee bundles' task name"
    # This bundle creates no Terraform resources -- its fixtures are REST
    # objects -- so the accurate name is check-and-cleanup-fixtures. The alias
    # exists so one cross-bundle cleanup loop can call a single task name.
    cmds:
      - task: check-and-cleanup-fixtures

  check-unpushed-commits:
    desc: "Check for uncommitted/unpushed changes before testing"
    vars:
      BASE_DIR: "../"
    cmds:
      - |
        UNCOMMITTED_FILES=$(git diff --name-only HEAD | grep -E "^${BASE_DIR}(\.runwhen|[^/]+)" | grep -v "/\.test/" || true)
        if [ -n "$UNCOMMITTED_FILES" ]; then
          echo "✗ Uncommitted changes found:"
          echo "$UNCOMMITTED_FILES"
          echo "Remember to commit & push changes before executing the run-rwl-discovery task."
          exit 1
        else
          echo "√ No uncommitted changes in specified directories."
        fi
      - |
        git fetch origin
        UNPUSHED_FILES=$(git diff --name-only origin/$(git rev-parse --abbrev-ref HEAD) HEAD | grep -E "^${BASE_DIR}(\.runwhen|[^/]+)" | grep -v "/\.test/" || true)
        if [ -n "$UNPUSHED_FILES" ]; then
          echo "✗ Unpushed commits found:"
          echo "$UNPUSHED_FILES"
          echo "Remember to push changes before executing the run-rwl-discovery task."
          exit 1
        else
          echo "√ No unpushed commits in specified directories."
        fi

  generate-rwl-config:
    desc: "Generate RunWhen Local configuration (workspaceInfo.yaml)"
    env:
      GCP_PROJECT_ID: "{{.GCP_PROJECT_ID}}"
      APIGEE_ORG: '{{.APIGEE_ORG | default ""}}'
      RW_WORKSPACE: '{{.RW_WORKSPACE | default "my-workspace"}}'
    cmds:
      - |
        repo_url=$(git config --get remote.origin.url)
        branch_name=$(git rev-parse --abbrev-ref HEAD)
        codebundle=$(basename "$(dirname "$PWD")")

        cat <<EOF > workspaceInfo.yaml
        workspaceName: "$RW_WORKSPACE"
        workspaceOwnerEmail: authors@runwhen.com
        defaultLocation: location-01-us-west1
        defaultLOD: detailed
        writeWorkspaceFilesToDisk: true
        cloudConfig:
          gcp:
            applicationCredentialsFile: /shared/gcp.json.secret
            projects:
            - $GCP_PROJECT_ID
            projectLevelOfDetails:
              $GCP_PROJECT_ID: detailed
        custom:
          APIGEE_ORG: "$APIGEE_ORG"
        codeCollections:
        - repoURL: "$repo_url"
          branch: "$branch_name"
          codeBundles: ["$codebundle"]
        EOF

  run-rwl-discovery:
    desc: "Run RunWhen Local Discovery on test infrastructure"
    cmds:
      - |
        CONTAINER_NAME="RunWhenLocal"
        if docker ps -q --filter "name=$CONTAINER_NAME" | grep -q .; then
          echo "Stopping and removing existing container $CONTAINER_NAME..."
          docker stop $CONTAINER_NAME && docker rm $CONTAINER_NAME
        elif docker ps -a -q --filter "name=$CONTAINER_NAME" | grep -q .; then
          echo "Removing existing stopped container $CONTAINER_NAME..."
          docker rm $CONTAINER_NAME
        else
          echo "No existing container named $CONTAINER_NAME found."
        fi

        sudo rm -rf output || { echo "Failed to remove output directory"; exit 1; }
        mkdir output && chmod 777 output || { echo "Failed to set permissions"; exit 1; }

        docker run --name $CONTAINER_NAME -p 8081:8081 -v "$(pwd)":/shared -d ghcr.io/runwhen-contrib/runwhen-local:latest || {
          echo "Failed to start container"; exit 1;
        }

        docker exec -w /workspace-builder $CONTAINER_NAME ./run.sh --verbose || {
          echo "Error executing script in container"; exit 1;
        }

        # Discovery "succeeding" while producing no SLX is the failure this
        # task exists to catch, so assert on the output rather than trusting
        # the exit code alone.
        slx_root="output/workspaces"
        if [ ! -d "$slx_root" ] || [ -z "$(find "$slx_root" -name 'slx.yaml' -print -quit)" ]; then
          echo "Error: discovery produced no SLX definitions under $slx_root" >&2
          exit 1
        fi

        echo "Review generated config files under output/workspaces/"
        find "$slx_root" -name 'slx.yaml' | sed 's|^|  |'

  validate-generation-rules:
    desc: "Validate YAML files in .runwhen/generation-rules (non-zero exit on invalid)"
    cmds:
      - |
        set -euo pipefail

        for cmd in curl yq ajv; do
          if ! command -v $cmd &> /dev/null; then
            echo "Error: $cmd is required but not installed." >&2
            exit 1
          fi
        done

        temp_dir=$(mktemp -d)
        trap 'rm -rf "$temp_dir"' EXIT
        schema="$temp_dir/generation-rule-schema.json"

        # -f so an HTTP error is an error, plus a parse check: a 404 body or a
        # truncated download would otherwise be handed to ajv, fail every file,
        # and look like a schema violation rather than a failed download.
        if ! curl -fsS -o "$schema" \
          https://raw.githubusercontent.com/runwhen-contrib/runwhen-local/refs/heads/main/src/generation-rule-schema.json; then
          echo "Error: could not download the generation-rule schema." >&2
          exit 1
        fi
        if ! jq -e . "$schema" >/dev/null 2>&1; then
          echo "Error: downloaded generation-rule schema is not valid JSON." >&2
          exit 1
        fi

        shopt -s nullglob
        yaml_files=(../.runwhen/generation-rules/*.yaml)
        # An unmatched glob would otherwise expand to itself and validate nothing
        # while reporting success.
        if [ ${#yaml_files[@]} -eq 0 ]; then
          echo "Error: no generation rules found in ../.runwhen/generation-rules/." >&2
          exit 1
        fi

        invalid=0
        for yaml_file in "${yaml_files[@]}"; do
          echo "Validating $yaml_file"
          json_file="$temp_dir/$(basename "${yaml_file%.*}.json")"
          if ! yq -o=json "$yaml_file" > "$json_file"; then
            echo "  ✗ $yaml_file is not parseable YAML" >&2
            invalid=$((invalid + 1))
            continue
          fi
          if ajv validate -s "$schema" -d "$json_file" --spec=draft2020 --strict=false; then
            echo "  ✓ $yaml_file is valid."
          else
            echo "  ✗ $yaml_file is invalid." >&2
            invalid=$((invalid + 1))
          fi
        done

        if [ "$invalid" -gt 0 ]; then
          echo "Error: $invalid generation rule file(s) failed validation." >&2
          exit 1
        fi

  check-rwp-config:
    desc: "Check if env vars are set for RunWhen Platform"
    cmds:
      - |
        missing_vars=()
        if [ -z "$RW_WORKSPACE" ]; then missing_vars+=("RW_WORKSPACE"); fi
        if [ -z "$RW_API_URL" ]; then missing_vars+=("RW_API_URL"); fi
        if [ -z "$RW_PAT" ]; then missing_vars+=("RW_PAT"); fi
        if [ ${#missing_vars[@]} -ne 0 ]; then
          echo "The following required environment variables are missing: ${missing_vars[*]}"
          exit 1
        fi

  upload-slxs:
    desc: "Upload SLX files to the appropriate URL"
    env:
      RW_WORKSPACE: "{{.RW_WORKSPACE}}"
      RW_API_URL: "{{.RW_API}}"
      RW_PAT: "{{.RW_PAT}}"
    cmds:
      - task: check-rwp-config
      - |
        BASE_DIR="output/workspaces/${RW_WORKSPACE}/slxs"
        if [ ! -d "$BASE_DIR" ]; then
          echo "Directory $BASE_DIR does not exist. Upload aborted."
          exit 1
        fi

        for dir in "$BASE_DIR"/*; do
          if [ -d "$dir" ]; then
            SLX_NAME=$(basename "$dir")
            PAYLOAD=$(jq -n --arg commitMsg "Creating new SLX $SLX_NAME" '{ commitMsg: $commitMsg, files: {} }')
            for file in slx.yaml runbook.yaml sli.yaml; do
              if [ -f "$dir/$file" ]; then
                CONTENT=$(cat "$dir/$file")
                PAYLOAD=$(echo "$PAYLOAD" | jq --arg fileContent "$CONTENT" --arg fileName "$file" '.files[$fileName] = $fileContent')
              fi
            done

            URL="https://${RW_API_URL}/api/v3/workspaces/${RW_WORKSPACE}/branches/main/slxs/${SLX_NAME}"
            echo "Uploading SLX: $SLX_NAME to $URL"
            response=$(curl -v -X POST "$URL" \
              -H "Authorization: Bearer $RW_PAT" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" -w "%{http_code}" -o /dev/null -s 2>&1)

            if [[ "$response" =~ 200|201 ]]; then
              echo "Successfully uploaded SLX: $SLX_NAME to $URL"
            else
              echo "Failed to upload SLX: $SLX_NAME to $URL. Response:"
              echo "$response"
            fi
          fi
        done

  delete-slxs:
    desc: "Delete SLX objects from the appropriate URL"
    env:
      RW_WORKSPACE: '{{.RW_WORKSPACE | default "my-workspace"}}'
      RW_API_URL: "{{.RW_API}}"
      RW_PAT: "{{.RW_PAT}}"
    cmds:
      - task: check-rwp-config
      - |
        BASE_DIR="output/workspaces/${RW_WORKSPACE}/slxs"
        if [ ! -d "$BASE_DIR" ]; then
          echo "Directory $BASE_DIR does not exist. Deletion aborted."
          exit 1
        fi

        for dir in "$BASE_DIR"/*; do
          if [ -d "$dir" ]; then
            SLX_NAME=$(basename "$dir")
            URL="https://${RW_API_URL}/api/v3/workspaces/${RW_WORKSPACE}/branches/main/slxs/${SLX_NAME}"
            echo "Deleting SLX: $SLX_NAME from $URL"
            response=$(curl -v -X DELETE "$URL" \
              -H "Authorization: Bearer $RW_PAT" \
              -H "Content-Type: application/json" -w "%{http_code}" -o /dev/null -s 2>&1)

            if [[ "$response" =~ 200|204 ]]; then
              echo "Successfully deleted SLX: $SLX_NAME from $URL"
            else
              echo "Failed to delete SLX: $SLX_NAME from $URL. Response:"
              echo "$response"
            fi
          fi
        done

  clean-rwl-discovery:
    desc: "Clean up RunWhen Local discovery output"
    cmds:
      - |
        sudo rm -rf output
        rm -f workspaceInfo.yaml
