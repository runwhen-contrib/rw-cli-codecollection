apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: Health Score
  displayUnitsShort: ''
  locations:
    - {{default_location}}
  description: Average of three Apigee proxy health dimensions (deployment state, revision drift, failed/undeployed proxies) scored 0-1 for project {{project.name}}. Kept to fast management-API checks; deeper Analytics diagnostics live in the runbook because Analytics lags real time.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigee-proxy-health/sli.robot
  intervalStrategy: intermezzo
  intervalSeconds: 180
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: APIGEE_ORG
      value: '{{custom.apigee_org | default("")}}'
    - name: PROXIES
      value: '{{custom.proxies | default("All")}}'
    - name: ENVIRONMENTS
      value: '{{custom.environments | default("All")}}'
    - name: POLICY_ERROR_THRESHOLD
      value: '{{custom.policy_error_threshold | default("0.01")}}'
    - name: TARGET_ERROR_THRESHOLD
      value: '{{custom.target_error_threshold | default("0.01")}}'
    - name: LATENCY_MS_THRESHOLD
      value: '{{custom.latency_ms_threshold | default("5000")}}'
    - name: OVERHEAD_MS_THRESHOLD
      value: '{{custom.overhead_ms_threshold | default("500")}}'
    - name: AUTH_ERROR_RATE_THRESHOLD
      value: '{{custom.auth_error_rate_threshold | default("0.02")}}'
    - name: RATE_LIMIT_ERROR_THRESHOLD
      value: '{{custom.rate_limit_error_threshold | default("0.05")}}'
    - name: ANALYTICS_WINDOW_MIN
      value: '{{custom.analytics_window_min | default("60")}}'
    - name: OPERATIONS_LOOKBACK_HOURS
      value: '{{custom.operations_lookback_hours | default("24")}}'
    - name: REVISION_ACCUMULATION_THRESHOLD
      value: '{{custom.revision_accumulation_threshold | default("20")}}'
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m
