apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/apigee_api_platform/apigee_api_platform.svg
  alias: GCP Apigee API Proxy Health for Project {{project.name}}
  # Quoted: the text contains a colon, which YAML would otherwise read as a
  # nested mapping key and fail to parse.
  asMeasuredBy: "Issues raised by the runbook against the Apigee organization of project {{project.name}} -- deployment state, revision drift, undeployed proxies, revision accumulation, failed management operations, and the policy_error vs target_error, latency-overhead and auth/quota splits. This SLX reports findings rather than a score: there is no SLI, because every check one would have scored is already run by the runbook."
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: Apigee API proxies should be deployed in a READY state, on their latest revision without cross-environment drift, with no failed or orphaned deployments, and with error and latency signals within acceptable thresholds.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: apigee
    - name: category
      value: api-management
    - name: scope
      value: Project
    - name: access
      value: read-only
