apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/apigee.svg
  alias: GCP Apigee API Proxy Health for Project {{project.name}}
  asMeasuredBy: A 0-1 score averaged across deployment state, revision drift, and failed/undeployed proxies for the Apigee organization of project {{project.name}}. Deeper diagnostics (policy_error vs target_error split, latency overhead, auth/quota error rates) are available in the associated runbook.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: Apigee API proxies should be deployed in a READY state, on their latest revision without cross-environment drift, with no failed or orphaned deployments, and with error and latency signals within acceptable thresholds.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: apigee
    - name: scope
      value: Project
    - name: access
      value: read-only
