apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
# Kept identical to the SLX template's chain on purpose: the two must not be
# able to disagree about which org this SLX covers. See that file for why every
# default is in boolean mode, and why _res is materialised before use rather
# than reaching through match_resource.resource.name directly.
{% set _res = match_resource.resource | default({}, true) %}
{% set apigee_org = custom.apigee_org | default(_res.name, true) | default(qualifiers.resource, true) | default(match_resource.name, true) | default('', true) %}
spec:
  location: {{default_location}}
  description: Diagnoses GCP Apigee API proxy health for organization {{apigee_org}} in project {{project.name}} -- discovers org-wide proxy deployments, then checks deployment state, revision drift, failed/undeployed proxies, revision housekeeping, the policy_error vs target_error split, latency and processing overhead, HTTP auth/quota error rates, and failed long-running operations.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigee-proxy-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: APIGEE_ORG
      value: '{{apigee_org}}'
    - name: PROXIES
      value: '{{custom.proxies | default("All")}}'
    - name: ENVIRONMENTS
      value: '{{custom.environments | default("All")}}'
    - name: POLICY_ERROR_THRESHOLD
      value: '{{custom.policy_error_threshold | default("0.01")}}'
    - name: TARGET_ERROR_THRESHOLD
      value: '{{custom.target_error_threshold | default("0.01")}}'
    - name: LATENCY_MS_THRESHOLD
      value: '{{custom.latency_ms_threshold | default("5000")}}'
    - name: OVERHEAD_MS_THRESHOLD
      value: '{{custom.overhead_ms_threshold | default("500")}}'
    - name: AUTH_ERROR_RATE_THRESHOLD
      value: '{{custom.auth_error_rate_threshold | default("0.02")}}'
    - name: RATE_LIMIT_ERROR_THRESHOLD
      value: '{{custom.rate_limit_error_threshold | default("0.05")}}'
    - name: ANALYTICS_WINDOW_MIN
      value: '{{custom.analytics_window_min | default("60")}}'
    - name: APIGEE_MAX_STATUS_CALLS
      value: '{{custom.apigee_max_status_calls | default("250")}}'
    - name: REVISION_ACCUMULATION_THRESHOLD
      value: '{{custom.revision_accumulation_threshold | default("20")}}'
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
