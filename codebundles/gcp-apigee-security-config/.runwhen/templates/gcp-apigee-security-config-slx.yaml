apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/access-context-manager/access-context-manager.svg
  alias: "{{match_resource.resource.name}} Apigee Security and Configuration Health"
  asMeasuredBy: A combined score of TLS keystore alias expiry, API product quota/rate limits, developer app access scope, Apigee security score, and target server TLS for the Apigee organization. A score of 1 is healthy, less than 1 indicates issues.
  configProvided:
    - name: APIGEE_ORG
      value: "{{project.name}}"
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: Apigee organizations should have valid TLS aliases, sensible API product quotas, least-privilege developer app access, an acceptable security score, and TLS-enabled target servers.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: apigee
    - name: category
      value: security
    - name: access
      value: read-only
