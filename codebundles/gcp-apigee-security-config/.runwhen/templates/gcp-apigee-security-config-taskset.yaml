apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Runs tasks to validate the security posture and configuration of the GCP Apigee organization including TLS keystore alias expiry, API product quota/rate limits, developer app access scope, security score, and target server configuration.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigee-security-config/runbook.robot
  configProvided:
    - name: APIGEE_ORG
      value: "{{project.name}}"
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: CERT_EXPIRY_WARNING_DAYS
      value: "30"
    - name: QUOTA_ABUSE_THRESHOLD
      value: "1000000"
    - name: SECURITY_SCORE_THRESHOLD
      value: "80"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
