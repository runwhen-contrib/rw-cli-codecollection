apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: Health Score
  displayUnitsShort: ''
  locations:
    - {{default_location}}
  description: Average of four Apigee traffic and performance health dimensions (error/fault rate, latency performance, throughput/anomaly status, target/backend performance) scored 0-1 for organization {{match_resource.resource_name}}
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigee-traffic-health/sli.robot
  intervalStrategy: intermezzo
  intervalSeconds: 180
  configProvided:
    - name: APIGEE_ORG
      value: "{{match_resource.resource_name}}"
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: ERROR_RATE_THRESHOLD
      value: '{{custom.error_rate_threshold | default("5")}}'
    - name: LATENCY_MS_THRESHOLD
      value: '{{custom.latency_ms_threshold | default("500")}}'
    - name: METRIC_WINDOW_MIN
      value: '{{custom.metric_window_min | default("60")}}'
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m
