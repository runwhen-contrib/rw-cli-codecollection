apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/apigee/apigee.svg
  alias: GCP Apigee Traffic and Performance Health for Organization {{match_resource.resource_name}}
  asMeasuredBy: A 0-1 score averaged across Apigee error/fault rate, latency performance, throughput/anomaly status, and target/backend performance for organization {{match_resource.resource_name}}
  configProvided:
  - name: APIGEE_ORG
    value: "{{match_resource.resource_name}}"
  - name: GCP_PROJECT_ID
    value: "{{project.name}}"
  owners:
  - {{workspace.owner_email}}
  statement: Apigee API proxies should have low error/fault rates, acceptable latency, stable throughput with no anomalies, and healthy target/backend servers.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: apigee
    - name: scope
      value: Organization
    - name: access
      value: read-only
