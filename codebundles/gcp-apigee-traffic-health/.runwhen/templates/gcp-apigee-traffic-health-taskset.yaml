apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
# Kept identical to the SLX template's chain on purpose: the two must not be
# able to disagree about which org this SLX covers. See that file for why every
# default is in boolean mode, and why _res is materialised before use rather
# than reaching through match_resource.resource.name directly.
{% set _res = match_resource.resource | default({}, true) %}
{% set apigee_org = custom.apigee_org | default(_res.name, true) | default(qualifiers.resource, true) | default(match_resource.name, true) | default('', true) %}
spec:
  location: {{default_location}}
  description: Monitors runtime traffic and performance of Apigee organization {{apigee_org}} in project {{project.name}} -- checks proxy error/fault rates, latency percentiles, throughput anomalies, and target/backend performance against Cloud Monitoring.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-apigee-traffic-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: APIGEE_ORG
      value: '{{apigee_org}}'
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: ERROR_RATE_THRESHOLD
      value: '{{custom.error_rate_threshold | default("5")}}'
    - name: LATENCY_MS_THRESHOLD
      value: '{{custom.latency_ms_threshold | default("500")}}'
    - name: METRIC_WINDOW_MIN
      value: '{{custom.metric_window_min | default("60")}}'
    - name: THROUGHPUT_DEVIATION_PCT
      value: '{{custom.throughput_deviation_pct | default("200")}}'
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
