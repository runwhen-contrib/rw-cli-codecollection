version: "3"

silent: true

# The RunWhen Platform tasks -- check-rwp-config, upload-slxs, delete-slxs --
# come from the collection-wide Taskfile rather than being copied in here.
#
# All five Apigee bundles carried their own copies, and all five had drifted:
# they still POST to api/v3/workspaces/${RW_WORKSPACE}/branches/main/slxs/...
# while the shared file moved to v4 typed sync for upload and the v3 short-name
# endpoint for delete. 49 other bundles in this collection already include it,
# so the copies were the outlier, not the include.
#
# .test/ is harness, not shipped bundle content, so the "a codebundle cannot
# import from a sibling directory" constraint that forces duplication in the
# runtime scripts does not apply to it.
includes:
  shared:
    taskfile: ../../.test-tasks/Taskfile.yaml
    dir: .

vars:
  codebundle: "gcp-apigee-traffic-health"

# -----------------------------------------------------------------------------
# STANDARD VOCABULARY
#
# Every gcp-apigee-* bundle declares the same task names, with the same
# responsibilities and the same exit semantics, so `task --list` reads the same
# in all five and an operator moving between them does not have to relearn it:
#
#   default  ci -> check-unpushed-commits -> build-infra -> test-live
#            -> generate-rwl-config -> run-rwl-discovery
#   ci       test-offline -> test-render -> validate-generation-rules
#            -> check-shared-drift
#   clean    check-and-cleanup-fixtures -> clean-rwl-discovery
#
# Two rules keep it that way:
#
#   1. Only the standard vocabulary carries `desc:`. Implementation sub-steps
#      are `internal: true` -- still reachable via `task --list-all` for
#      debugging, absent from `task --list`, which is the operator's view.
#
#   2. A task that does not apply to a bundle is still DECLARED, and fails with
#      a sentence explaining why. A missing task reads as a typo; a task that
#      says "this bundle creates no fixtures of its own" reads as an answer.
# -----------------------------------------------------------------------------
tasks:
  default:
    desc: "Credential-free tiers, then live fixtures, live assertions and discovery"
    cmds:
      - task: ci
      - task: check-unpushed-commits
      - task: build-infra
      - task: test-live
      - task: generate-rwl-config
      - task: run-rwl-discovery

  # The credential-free tiers run FIRST. They need no cloud and no spend, so
  # there is no reason to provision anything before finding out the check logic
  # is broken. Discovery is in `default` deliberately: without it a green run
  # says nothing about the generation rule, which gates on
  # gcp_apigee_organizations and is only exercised end to end by a real
  # discovery pass against an indexed org.
  ci:
    desc: "Every tier that needs no cloud, no credentials and no spend -- gates a PR"
    cmds:
      - task: test-offline
      - task: test-render
      - task: validate-generation-rules
      - task: check-shared-drift

  test-offline:
    desc: "Assert the check logic against canned API responses -- no cloud, no credentials"
    cmds:
      - |
        chmod +x offline/run.sh
        ./offline/run.sh

  test-render:
    desc: "Render the SLX/taskset templates the way runwhen-local does and assert on the result"
    cmds:
      - |
        chmod +x render/run.sh
        ./render/run.sh

  # Fixtures: this bundle reads Cloud Monitoring aggregates for proxies the
  # sibling bundles deploy, so Terraform provisions no Apigee objects of its
  # own -- it publishes the expected discovery ground truth instead.
  # bootstrap-prerequisites runs FIRST, and unconditionally. It is idempotent
  # and no-ops in seconds once satisfied, so making every build-infra call it
  # removes the last thing an operator had to know: which bundle to run first.
  # Same argument as folding the keystore import into build-infra -- a
  # prerequisite you have to remember is a prerequisite people forget.
  #
  # preflight then asserts the substrate really is there before a single fixture
  # is created, so a missing environment is an instruction rather than a 404.
  build-infra:
    desc: "Create this bundle's test fixtures (healthy + deliberately broken cases)"
    cmds:
      - task: bootstrap-prerequisites
      - task: preflight
      - task: build-terraform-infra

  test-live:
    desc: "Run the checks against the live fixtures and assert on the issues raised"
    cmds:
      - |
        chmod +x test-live.sh
        ./test-live.sh

  check-and-cleanup-fixtures:
    desc: "Remove this bundle's fixtures and verify none survive"
    cmds:
      - task: destroy-terraform-fixtures

  build-terraform-infra:
    internal: true
    dir: terraform
    cmds:
      - |
        set -e
        # Fixture provisioning must exit non-zero when it cannot run. Printing
        # "Skipping" and returning 0 tells the caller the infrastructure exists
        # when it does not, and every step after it then validates nothing --
        # which is exactly what `default` used to do before discovery was added
        # to the chain. load-credentials.sh enforces that and resolves the
        # shared-org contract in one place. This task runs with `dir: terraform`,
        # hence the ../.
        . ../load-credentials.sh
        terraform init
        terraform plan -out=tfplan
        terraform apply tfplan

  destroy-terraform-fixtures:
    internal: true
    cmds:
      - |
        set -e
        # Guard on the state file BEFORE sourcing credentials: with no state
        # there is nothing to destroy, and failing for want of a tf.secret would
        # make `task clean` unusable on a checkout that never provisioned.
        if [ ! -f "terraform/terraform.tfstate" ]; then
          echo "No terraform/terraform.tfstate; nothing for Terraform to destroy."
          exit 0
        fi
        . ./load-credentials.sh
        cd terraform
        terraform destroy -auto-approve

  # `delete-slxs` is deliberately NOT in this chain.
  #
  # It used to be, and it made `task clean` unusable locally: delete-slxs calls
  # check-rwp-config, which exits 1 without RW_WORKSPACE/RW_API_URL/RW_PAT, so
  # the task exited non-zero and clean-rwl-discovery never ran -- leaving a
  # root-owned output/ behind after every run on a machine with no Platform
  # credentials. Removing SLXs from a workspace is a different, deliberate act
  # from cleaning up a local test run; it stays available as `task delete-slxs`.
  clean:
    desc: "Remove this bundle's fixtures and local discovery output"
    cmds:
      - task: check-and-cleanup-fixtures
      - task: clean-rwl-discovery

  # --- Shared substrate -------------------------------------------------------
  # Present in ALL five Apigee bundles, running the same byte-identical script,
  # so each bundle is self-sufficient: no bundle needs another to have been run
  # first, and the order they are torn down in does not matter.
  #
  # It provisions the APIs, VPC, peering range, organization, BOTH environments
  # and the runtime instance. The environments and the instance are here rather
  # than in one bundle's Terraform because an EVALUATION org is hard-capped at
  # two environments and one instance -- a capped resource is shared by
  # definition, and four of the five bundles need these. See
  # apigee_prerequisites.sh for THE SUBSTRATE CONTRACT, including the invariant
  # that apigee-env-unattached-* being unattached is a FIXTURE, not a defect.
  #
  # build-infra calls this itself, so it is not something anyone has to remember.
  # Running it directly is still useful: it is the slow step (25-45 minutes for
  # the runtime instance on first create) and worth starting on its own.
  bootstrap-prerequisites:
    desc: "Idempotent: provision the shared substrate (APIs, VPC, peering, org, environments, instance)"
    cmds:
      - |
        set -e
        . ./load-credentials.sh
        bash apigee_prerequisites.sh bootstrap

  destroy-prerequisites:
    desc: "OPT-IN: remove the shared substrate. Refuses while the Apigee org still exists"
    cmds:
      - |
        set -e
        . ./load-credentials.sh
        bash apigee_prerequisites.sh destroy

  # Runs BEFORE any fixture is created, in every bundle. It asserts the named
  # substrate contract rather than counting environments, because a count cannot
  # catch the failure that motivated it: with one environment instead of two,
  # proxy-health's bootstrap SKIPS its cross-environment drift fixture behind an
  # `if [ -n "$env2" ]` and check_revision_drift.sh then reports clean -- not
  # because there is no drift, but because nothing was created to drift.
  preflight:
    desc: "Assert the shared Apigee substrate exists before creating fixtures"
    cmds:
      - |
        set -e
        . ./load-credentials.sh
        chmod +x apigee_preflight.sh
        ./apigee_preflight.sh

  check-shared-drift:
    desc: "Fail when a file meant to be identical across the Apigee bundles has diverged"
    cmds:
      - |
        chmod +x check-shared-drift.sh
        ./check-shared-drift.sh

  check-unpushed-commits:
    desc: "Check for uncommitted/unpushed changes before testing"
    vars:
      BASE_DIR: "../"
    cmds:
      - |
        UNCOMMITTED_FILES=$(git diff --name-only HEAD | grep -E "^${BASE_DIR}(\.runwhen|[^/]+)" | grep -v "/\.test/" || true)
        if [ -n "$UNCOMMITTED_FILES" ]; then
          echo "Uncommitted changes found:"
          echo "$UNCOMMITTED_FILES"
          echo "Remember to commit & push changes before executing the run-rwl-discovery task."
          exit 1
        else
          echo "No uncommitted changes in specified directories."
        fi
      - |
        git fetch origin
        UNPUSHED_FILES=$(git diff --name-only origin/$(git rev-parse --abbrev-ref HEAD) HEAD | grep -E "^${BASE_DIR}(\.runwhen|[^/]+)" | grep -v "/\.test/" || true)
        if [ -n "$UNPUSHED_FILES" ]; then
          echo "Unpushed commits found:"
          echo "$UNPUSHED_FILES"
          echo "Remember to push changes before executing the run-rwl-discovery task."
          exit 1
        else
          echo "No unpushed commits in specified directories."
        fi

  generate-rwl-config:
    desc: "Generate RunWhen Local configuration (workspaceInfo.yaml)"
    env:
      GCP_PROJECT_ID: "{{.GCP_PROJECT_ID}}"
      RW_WORKSPACE: '{{.RW_WORKSPACE | default "my-workspace"}}'
    cmds:
      - |
        repo_url=$(git config --get remote.origin.url)
        branch_name=$(git rev-parse --abbrev-ref HEAD)
        codebundle=$(basename "$(dirname "$PWD")")

        cat <<EOF > workspaceInfo.yaml
        workspaceName: "$RW_WORKSPACE"
        workspaceOwnerEmail: authors@runwhen.com
        defaultLocation: location-01-us-west1
        defaultLOD: detailed
        writeWorkspaceFilesToDisk: true
        cloudConfig:
          gcp:
            applicationCredentialsFile: /shared/gcp.json.secret
            projects:
            - $GCP_PROJECT_ID
            projectLevelOfDetails:
              $GCP_PROJECT_ID: detailed
        codeCollections:
        - repoURL: "$repo_url"
          branch: "$branch_name"
          codeBundles: ["$codebundle"]
        EOF

  run-rwl-discovery:
    desc: "Run RunWhen Local Discovery on test infrastructure"
    cmds:
      - |
        CONTAINER_NAME="RunWhenLocal"
        if docker ps -q --filter "name=$CONTAINER_NAME" | grep -q .; then
          echo "Stopping and removing existing container $CONTAINER_NAME..."
          docker stop $CONTAINER_NAME && docker rm $CONTAINER_NAME
        elif docker ps -a -q --filter "name=$CONTAINER_NAME" | grep -q .; then
          echo "Removing existing stopped container $CONTAINER_NAME..."
          docker rm $CONTAINER_NAME
        else
          echo "No existing container named $CONTAINER_NAME found."
        fi

        sudo rm -rf output || { echo "Failed to remove output directory"; exit 1; }
        mkdir output && chmod 777 output || { echo "Failed to set permissions"; exit 1; }

        # PINNED, not `latest`. The generation rule gates on
        # gcp_apigee_organizations, and that type reached the GCP resource-type
        # registry (indexers/gcp_resource_type_registry.yaml) in 0.11.11. The
        # `latest` tag in ghcr still resolves to an image whose registry does
        # NOT carry it -- so `latest` is not "the newest", it is a version too
        # old for this bundle, and pulling it again does not help.
        #
        # On such an image discovery exits 0 and produces ZERO SLXs, with the
        # only explanation in a WARNING several lines above the summary.
        # Override once `latest` has caught up:
        #   task run-rwl-discovery RWL_IMAGE=ghcr.io/runwhen-contrib/runwhen-local:latest
        RWL_IMAGE="${RWL_IMAGE:-ghcr.io/runwhen-contrib/runwhen-local:0.11.12}"
        echo "Using RunWhen Local image: $RWL_IMAGE"
        docker pull "$RWL_IMAGE" >/dev/null || \
          echo "WARNING: could not pull $RWL_IMAGE; using the cached image."

        # Check the image BEFORE running it. Without this the failure surfaces
        # as "0 SLXs", which reads as "the rule matched nothing" -- a bundle
        # problem -- when it is really an image problem. Ask the image what it
        # knows rather than trusting its tag.
        if ! docker run --rm --entrypoint bash "$RWL_IMAGE" -lc \
              'grep -q "gcp_apigee_organizations" /workspace-builder/indexers/gcp_resource_type_registry.yaml' 2>/dev/null; then
          echo "Error: $RWL_IMAGE does not know the resource type gcp_apigee_organizations." >&2
          echo "       Its GCP resource-type registry predates Apigee support, so this" >&2
          echo "       bundle's generation rule would match nothing and discovery would" >&2
          echo "       report success with zero SLXs." >&2
          echo "       Use 0.11.11 or newer, or override with RWL_IMAGE=<image>." >&2
          exit 1
        fi

        docker run --name $CONTAINER_NAME -p 8081:8081 -v "$(pwd)":/shared -d "$RWL_IMAGE" || {
          echo "Failed to start container"; exit 1;
        }

        docker exec -w /workspace-builder $CONTAINER_NAME ./run.sh --verbose || {
          echo "Error executing script in container"; exit 1;
        }

        # Discovery "succeeding" while producing no SLX is the failure this
        # task exists to catch, so assert on the output rather than trusting
        # the exit code alone.
        slx_root="output/workspaces"
        if [ ! -d "$slx_root" ] || [ -z "$(find "$slx_root" -name 'slx.yaml' -print -quit)" ]; then
          echo "Error: discovery produced no SLX definitions under $slx_root" >&2
          echo "       The image carries the Apigee resource types (checked above), so" >&2
          echo "       this is not the version trap -- look at whether the project has" >&2
          echo "       an Apigee organization the credential can see." >&2
          exit 1
        fi

        echo "Review generated config files under output/workspaces/"
        find "$slx_root" -name 'slx.yaml' | sed 's|^|  |'

  validate-generation-rules:
    desc: "Validate .runwhen/generation-rules against the published schema (fails on an invalid rule)"
    cmds:
      - |
        set -u
        for cmd in curl yq ajv jq; do
          if ! command -v $cmd &> /dev/null; then
            echo "Error: $cmd is required but not installed."
            exit 1
          fi
        done

        temp_dir=$(mktemp -d)
        trap 'rm -rf "${temp_dir}"' EXIT
        schema="${temp_dir}/generation-rule-schema.json"
        schema_url="https://raw.githubusercontent.com/runwhen-contrib/runwhen-local/refs/heads/main/src/generation-rule-schema.json"

        # -f matters: an unchecked `curl -s` writes GitHub's error page (or
        # nothing) to the schema on a 404 or network blip. Every rule then
        # "fails" against that garbage while the task still exits 0, so an
        # outage is indistinguishable from broken rules and from success.
        if ! curl -fsS -o "${schema}" "${schema_url}"; then
          echo "ERROR: could not download the generation-rule schema from ${schema_url}"
          exit 1
        fi
        if ! jq -e . "${schema}" >/dev/null 2>&1; then
          echo "ERROR: downloaded generation-rule schema is not valid JSON"
          exit 1
        fi

        rules_found=0
        failed=0
        for yaml_file in ../.runwhen/generation-rules/*.yaml; do
          # An unmatched glob expands to itself; without this a missing or
          # renamed directory would validate nothing and report success.
          [ -e "${yaml_file}" ] || continue
          rules_found=$((rules_found + 1))
          echo "Validating ${yaml_file}"
          json_file="${temp_dir}/$(basename "${yaml_file%.*}").json"
          if ! yq -o=json "${yaml_file}" > "${json_file}"; then
            echo "  ERROR: ${yaml_file} could not be converted to JSON"
            failed=$((failed + 1))
            continue
          fi
          # The previous form was `ajv ... && echo valid || echo invalid`, which
          # swallowed the failure: the block's exit status was the trailing
          # `rm -rf`, so an invalid rule printed "is invalid" and passed.
          if ajv validate -s "${schema}" -d "${json_file}" --spec=draft2020 --strict=false; then
            echo "  ${yaml_file} is valid."
          else
            echo "  ERROR: ${yaml_file} is invalid."
            failed=$((failed + 1))
          fi
        done

        if [ "${rules_found}" -eq 0 ]; then
          echo "ERROR: no generation rules found under ../.runwhen/generation-rules/"
          exit 1
        fi
        if [ "${failed}" -gt 0 ]; then
          echo "${failed} of ${rules_found} generation rule(s) failed validation."
          exit 1
        fi
        echo "All ${rules_found} generation rule(s) valid."

  # Thin wrappers over the collection-wide implementations, so the task names an
  # operator types here are the same ones every other bundle uses, while the
  # bodies live in exactly one place.
  check-rwp-config:
    desc: "Check if env vars are set for RunWhen Platform"
    cmds:
      - task: shared:check-rwp-config

  upload-slxs:
    desc: "Upload SLX files via V4 typed sync endpoints"
    cmds:
      - task: shared:upload-slxs

  delete-slxs:
    desc: "Delete SLX objects via V4 short-name endpoint"
    cmds:
      - task: shared:delete-slxs

  clean-rwl-discovery:
    desc: "Clean up RunWhen Local discovery output"
    cmds:
      - |
        # output/ is created by the discovery container and is therefore
        # root-owned, so removing it usually needs sudo -- but only usually.
        # An unconditional `sudo rm -rf` made `task clean` fail outright on any
        # machine without passwordless sudo, even when there was nothing to
        # remove or the directory was the caller's own. Try the cheap way, fall
        # back, and say plainly what to do if neither works.
        if [ -d output ]; then
          rm -rf output 2>/dev/null || sudo rm -rf output || {
            echo "ERROR: could not remove output/ -- it is root-owned (the discovery" >&2
            echo "       container created it) and sudo is unavailable here." >&2
            echo "       Remove it manually: sudo rm -rf $(pwd)/output" >&2
            exit 1
          }
        fi
        rm -f workspaceInfo.yaml
