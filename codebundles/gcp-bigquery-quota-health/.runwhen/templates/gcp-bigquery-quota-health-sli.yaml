apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: OK
  displayUnitsShort: ok
  locations:
    - {{default_location}}
  description: Measures BigQuery quota health by scoring slot utilization, storage quota, daily query count, and dataset/table limits.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-bigquery-quota-health/sli.robot
  intervalStrategy: intermezzo
  intervalSeconds: 1800
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: SLOT_UTILIZATION_THRESHOLD
      value: "80"
    - name: STORAGE_QUOTA_THRESHOLD
      value: "85"
    - name: DAILY_QUERY_THRESHOLD
      value: "80"
    - name: DATASET_TABLE_THRESHOLD
      value: "80"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m
