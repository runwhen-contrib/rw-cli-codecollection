apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/bigquery/bigquery.svg
  alias: "{{match_resource.resource.name}} BigQuery Quota Health"
  asMeasuredBy: A combined score of slot utilization, storage quota usage, daily query count, and dataset/table counts for BigQuery. A score of 1 is healthy, less than 1 indicates quota pressure.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: BigQuery project should stay within its slot, storage, query, and dataset/table quota limits.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: bigquery
    - name: category
      value: quota
    - name: access
      value: read-only
