apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: Health Score
  displayUnitsShort: ''
  locations:
    - {{default_location}}
  description: Health score for Cloud Composer environment {{match_resource.resource.name}} -- averages binary sub-scores for environment state, configuration health, DAG/scheduler health, worker/queue health, and error logs (0-1).
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloud-composer-health/sli.robot
  intervalStrategy: intermezzo
  intervalSeconds: 600
  configProvided:
    - name: GCP_PROJECT_ID
      value: {{project.name}}
    - name: ENV_NAME
      value: "{{match_resource.resource.name}}"
    - name: LOG_LOOKBACK_WINDOW_DAYS
      value: "{{custom.log_lookback_window_days | default('14')}}"
    - name: STALE_QUEUE_AGE_MINUTES
      value: "{{custom.stale_queue_age_minutes | default('60')}}"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m
