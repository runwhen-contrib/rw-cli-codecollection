apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/composer/composer.svg
  alias: GCP Cloud Composer Health for Project {{project.name}}
  asMeasuredBy: The number of unhealthy or misconfigured GCP Cloud Composer environments in project {{project.name}}
  configProvided:
  - name: GCP_PROJECT_ID
    value: "{{project.name}}"
  - name: ENV_NAME
    value: "{{custom.env_name | default('All')}}"
  - name: LOG_LOOKBACK_WINDOW_DAYS
    value: "{{custom.log_lookback_window_days | default('14')}}"
  - name: STALE_QUEUE_AGE_MINUTES
    value: "{{custom.stale_queue_age_minutes | default('60')}}"
  owners:
  - {{workspace.owner_email}}
  statement: Cloud Composer environments should be RUNNING, correctly configured on LTS Airflow versions, with healthy DAGs and schedulers, no queue backlogs, and no error logs.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: cloud_composer
    - name: access
      value: read-only
