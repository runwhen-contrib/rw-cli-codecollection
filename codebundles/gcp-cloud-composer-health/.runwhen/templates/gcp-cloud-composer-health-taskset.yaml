apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Monitors GCP Cloud Composer (Managed Airflow) environments -- checks environment state, full configuration, DAG and scheduler health, worker and queue health, error logs, and produces a normalized health summary.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloud-composer-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: GCP_PROJECT_ID
      value: {{project.name}}
    - name: ENV_NAME
      value: "{{match_resource.resource.name}}"
    - name: LOG_LOOKBACK_WINDOW_DAYS
      value: "{{custom.log_lookback_window_days | default('14')}}"
    - name: STALE_QUEUE_AGE_MINUTES
      value: "{{custom.stale_queue_age_minutes | default('60')}}"
    - name: AIRFLOW_CLI_TIMEOUT_SECONDS
      value: "{{custom.airflow_cli_timeout_seconds | default('30')}}"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
