apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/cloud_composer/cloud_composer.svg
  alias: "{{match_resource.resource.name}} Cloud Composer Performance & Capacity"
  asMeasuredBy: A combined score of worker CPU utilization, task queue depth, and utilization balance for Cloud Composer environments. A score of 1 is healthy, less than 1 indicates capacity/performance issues such as saturation, backlogs, or over-provisioning.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: Cloud Composer environments should run within acceptable utilization bands, keep task queues drained, and not deviate significantly from their normal usage baseline.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: composer
    - name: category
      value: data
    - name: access
      value: read-only
