apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Runs tasks to analyze GCP Cloud Composer worker utilization, scheduler and queue utilization, over-provisioning, and usage deltas over configurable windows.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloud-composer-performance/runbook.robot
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: ENV_NAME
      value: "All"
    - name: LOOKBACK_WINDOW_MINUTES
      value: "1440"
    - name: BASELINE_WINDOW_MINUTES
      value: "10080"
    - name: UTILIZATION_THRESHOLD_PERCENT
      value: "80"
    - name: UNDERUTILIZATION_THRESHOLD_PERCENT
      value: "20"
    - name: DELTA_THRESHOLD_PERCENT
      value: "50"
    - name: QUEUE_BACKLOG_THRESHOLD
      value: "100"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
