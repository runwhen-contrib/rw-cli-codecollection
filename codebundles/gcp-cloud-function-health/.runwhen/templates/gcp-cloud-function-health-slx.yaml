apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/cloud_functions/cloud_functions.svg
  alias: GCP Cloud Function Health for Project {{match_resource.resource.project_id}}
  asMeasuredBy: The number of unhealthy GCP Cloud Functions (gen1 and gen2) in project {{match_resource.resource.project_id}}
  configProvided:
  - name: GCP_PROJECT_ID
    value: "{{match_resource.resource.project_id}}"
  owners:
  - {{workspace.owner_email}}
  statement: Cloud Functions should be healthy, securely configured, and correctly scaled -- no failed deployments, no public invokers, no misconfigured runtimes.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags: 
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: cloud_functions
    - name: access
      value: read-only