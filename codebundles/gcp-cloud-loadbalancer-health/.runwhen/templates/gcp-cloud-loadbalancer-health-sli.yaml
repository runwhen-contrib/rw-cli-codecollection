apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: Health Score
  displayUnitsShort: ''
  locations:
    - {{default_location}}
  description: Average of four load balancer health dimensions (SSL certificate health, backend health, error rate, latency performance) scored 0-1 for project {{project.name}}
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloud-loadbalancer-health/sli.robot
  intervalStrategy: intermezzo
  intervalSeconds: 180
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: SSL_WARNING_DAYS
      value: '{{custom.ssl_warning_days | default("30")}}'
    - name: ERROR_RATE_THRESHOLD
      value: '{{custom.error_rate_threshold | default("0.01")}}'
    - name: LATENCY_THRESHOLD_MS
      value: '{{custom.latency_threshold_ms | default("5000")}}'
    - name: METRIC_LOOKBACK_PERIOD
      value: '{{custom.metric_lookback_period | default("3600s")}}'
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m
