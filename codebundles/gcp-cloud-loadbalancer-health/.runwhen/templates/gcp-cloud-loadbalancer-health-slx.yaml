apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/cloud_load_balancing/cloud_load_balancing.svg
  alias: GCP Cloud Load Balancer Health for Project {{project.name}}
  asMeasuredBy: A 0-1 score averaged across SSL certificate health, backend health, error rate, and latency performance for all load balancers in project {{project.name}}
  configProvided:
  - name: GCP_PROJECT_ID
    value: "{{project.name}}"
  owners:
  - {{workspace.owner_email}}
  statement: GCP Cloud Load Balancers should have valid SSL certificates, healthy backends, low error rates, and acceptable latency.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: cloud_load_balancing
    - name: scope
      value: Project
    - name: access
      value: read-only
