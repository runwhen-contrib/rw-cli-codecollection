apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Diagnoses GCP Cloud Load Balancer health -- discovers forwarding rules and configuration, checks SSL certificate expiry, backend health, error rates, and latency, and generates a consolidated health summary for project {{project.name}}.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloud-loadbalancer-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: SSL_WARNING_DAYS
      value: '{{custom.ssl_warning_days | default("30")}}'
    - name: ERROR_RATE_THRESHOLD
      value: '{{custom.error_rate_threshold | default("0.01")}}'
    - name: LATENCY_THRESHOLD_MS
      value: '{{custom.latency_threshold_ms | default("5000")}}'
    - name: METRIC_LOOKBACK_PERIOD
      value: '{{custom.metric_lookback_period | default("3600s")}}'
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
