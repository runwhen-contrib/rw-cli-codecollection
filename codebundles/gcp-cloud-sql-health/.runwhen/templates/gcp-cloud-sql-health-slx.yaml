apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/sql/sql.svg
  alias: "{{match_resource.resource.name}} GCP Cloud SQL Health"
  asMeasuredBy: A combined score of instance status, configuration, availability/access, and IAM policy for GCP Cloud SQL instances. A score of 1 is healthy, less than 1 indicates issues.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: GCP Cloud SQL instances should be RUNNABLE, well-provisioned, not exposed to the public internet, and protected by least-privilege IAM.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: cloud-sql
    - name: category
      value: database
    - name: access
      value: read-only
