apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/cloud_run/cloud_run.svg
  alias: "GCP Cloud Run Service Health for Project {{project.name}}"
  asMeasuredBy: The number of unhealthy Cloud Run services, failed revisions, and troubled rollouts in project {{project.name}}
  configProvided:
  - name: GCP_PROJECT_ID
    value: "{{project.name}}"
  - name: RESOURCES
    value: "{{ custom.resources | default('All') }}"
  - name: ERROR_LOG_LOOKBACK
    value: "{{ custom.error_log_lookback | default('14d') }}"
  owners:
  - {{workspace.owner_email}}
  statement: GCP Cloud Run services should be healthy -- no failed revisions, all services Ready and serving traffic, and no troubled or aborted rollouts.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: cloud_run
    - name: access
      value: read-only
