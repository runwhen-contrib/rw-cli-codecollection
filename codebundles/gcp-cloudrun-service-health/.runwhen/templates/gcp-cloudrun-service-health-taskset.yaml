apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Debugs GCP Cloud Run service health -- lists failed revisions, checks service Ready and traffic serving, detects troubled or aborted rollouts, pulls ERROR logs for unhealthy services, and captures full service/revision configuration for LLM review.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloudrun-service-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: GCP_PROJECT_ID
      value: {{project.name}}
    - name: RESOURCES
      value: "{{ custom.resources | default('All') }}"
    - name: ERROR_LOG_LOOKBACK
      value: "{{ custom.error_log_lookback | default('14d') }}"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
