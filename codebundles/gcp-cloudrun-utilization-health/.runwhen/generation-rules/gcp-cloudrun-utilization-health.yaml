apiVersion: runwhen.com/v1
kind: GenerationRules
spec:
  platform: gcp
  generationRules:
    - resourceTypes:
        - gcp_run_services
      matchRules:
        - type: pattern
          pattern: ".+"
          properties: [project_id]
          mode: substring
      slxs:
        - baseName: gcp-cloudrun-utilization-health
          qualifiers: ["project"]
          baseTemplateName: gcp-cloudrun-utilization-health
          levelOfDetail: basic
          outputItems:
            - type: slx
            - type: sli
            - type: slo
            - type: runbook
              templateName: gcp-cloudrun-utilization-health-taskset.yaml
