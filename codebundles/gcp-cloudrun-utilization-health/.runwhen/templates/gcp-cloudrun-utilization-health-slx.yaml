apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/cloud_run/cloud_run.svg
  alias: GCP Cloud Run Utilization & Scaling Health for Project {{match_resource.resource.project_id}}
  asMeasuredBy: The number of Cloud Run services in project {{match_resource.resource.project_id}} that are over-utilized, at OOM risk, poorly scaled, or under-utilized
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{match_resource.resource.project_id}}"
  owners:
    - {{workspace.owner_email}}
  statement: Cloud Run services should be right-sized, well-scaled, and efficiently utilized -- no stuck high CPU/memory pressure, no unbounded or idle-warming instance scaling, and no wasted provisioned capacity.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: cloud_run
    - name: access
      value: read-only
