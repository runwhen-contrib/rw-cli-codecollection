apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Reviews GCP Cloud Run utilization and scaling health -- flags over-utilized CPU and memory (OOM risk), unbounded max instances, very low concurrency targets, idle-warming min-instances, and under-utilized services, and captures a utilization/scaling report for LLM cost and sizing review.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloudrun-utilization-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{match_resource.resource.project_id}}"
    - name: RESOURCES
      value: "{{custom.resources | default('All')}}"
    - name: METRIC_LOOKBACK_PERIOD
      value: "{{custom.metric_lookback_period | default('3600s')}}"
    - name: CPU_UTILIZATION_THRESHOLD
      value: "{{custom.cpu_utilization_threshold | default('80')}}"
    - name: MEMORY_UTILIZATION_THRESHOLD
      value: "{{custom.memory_utilization_threshold | default('85')}}"
    - name: MIN_UTILIZATION_THRESHOLD
      value: "{{custom.min_utilization_threshold | default('10')}}"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
