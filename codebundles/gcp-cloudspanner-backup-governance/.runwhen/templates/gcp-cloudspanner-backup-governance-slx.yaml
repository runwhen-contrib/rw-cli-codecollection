apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/cloud_spanner/cloud_spanner.svg
  alias: "{{project.name}} Cloud Spanner Backup & Data Protection"
  asMeasuredBy: A combined score of backup recency, backup expiration, PITR configuration, deletion protection, IAM access, and encryption for Cloud Spanner databases. A score of 1 is healthy, less than 1 indicates issues.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: Cloud Spanner databases should have recent, non-expiring backups, an adequate PITR window, deletion protection enabled, no public IAM access, and encryption compliant with policy.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: spanner
    - name: category
      value: data-protection
    - name: access
      value: read-only
