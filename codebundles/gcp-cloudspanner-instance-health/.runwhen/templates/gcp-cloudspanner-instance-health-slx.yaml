apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/spanner/spanner.svg
  alias: "{{match_resource.resource.name}} Cloud Spanner Instance Health"
  asMeasuredBy: A combined score of instance state, high-priority CPU utilization, storage utilization, and database state for Cloud Spanner instances. A score of 1 is healthy, less than 1 indicates issues.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: Cloud Spanner instances should be READY, stay under their high-priority CPU and storage thresholds, and have healthy databases with no long-running schema operations.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: spanner
    - name: category
      value: data
    - name: access
      value: read-only
