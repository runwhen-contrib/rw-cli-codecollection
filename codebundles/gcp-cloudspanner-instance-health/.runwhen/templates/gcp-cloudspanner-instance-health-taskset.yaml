apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Runs tasks to validate GCP Cloud Spanner instance health including instance state, high-priority CPU utilization, storage utilization, database state, and request latency/errors.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloudspanner-instance-health/runbook.robot
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: CPU_UTILIZATION_THRESHOLD
      value: "65"
    - name: MULTI_REGION_CPU_UTILIZATION_THRESHOLD
      value: "45"
    - name: STORAGE_UTILIZATION_THRESHOLD
      value: "75"
    - name: STORAGE_LIMIT_GB_PER_NODE
      value: "4096"
    - name: LATENCY_THRESHOLD_MS
      value: "100"
    - name: ERROR_RATE_THRESHOLD_PERCENT
      value: "1"
    - name: LONG_RUNNING_OPERATION_MINUTES
      value: "60"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
