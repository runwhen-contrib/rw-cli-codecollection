apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/spanner/spanner.svg
  alias: "{{match_resource.resource.name}} Cloud Spanner Query Performance"
  asMeasuredBy: A combined score of high-latency queries, lock contention, transaction abort rate, long-running queries, and CPU-heavy query hot spots read from SPANNER_SYS. A score of 1 is healthy, less than 1 indicates issues.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: Cloud Spanner query shapes should stay under the mean-latency, lock-wait, and abort-rate thresholds, active queries should not run indefinitely, and no single query shape should dominate instance CPU.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: spanner
    - name: category
      value: data
    - name: access
      value: read-only
