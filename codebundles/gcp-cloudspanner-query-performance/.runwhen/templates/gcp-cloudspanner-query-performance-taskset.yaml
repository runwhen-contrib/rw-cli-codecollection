apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Runs tasks to validate GCP Cloud Spanner query-level performance via SPANNER_SYS including high-latency queries, lock contention, transaction abort rate, long-running queries, and CPU-heavy hot spots.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-cloudspanner-query-performance/runbook.robot
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: QUERY_LATENCY_THRESHOLD_MS
      value: "100"
    - name: LOCK_WAIT_THRESHOLD_MS
      value: "1000"
    - name: ABORT_RATE_THRESHOLD_PERCENT
      value: "5"
    - name: LONG_RUNNING_QUERY_THRESHOLD_SECONDS
      value: "60"
    - name: STATS_WINDOW
      value: "HOUR"
    - name: CPU_TIME_SHARE_THRESHOLD_PERCENT
      value: "25"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
