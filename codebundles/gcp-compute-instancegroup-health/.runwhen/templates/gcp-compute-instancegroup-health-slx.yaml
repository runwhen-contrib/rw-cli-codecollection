apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/compute_engine/compute_engine.svg
  alias: GCP Compute Engine Instance Group Health for {{match_resource.resource.name}} in project {{project.name}}
  asMeasuredBy: A combined 0-1 score that includes member instance health, autoscaling and capacity, OS patch compliance, and CPU utilization for instance group {{match_resource.resource.name}} in project {{project.name}}. A score of 1 is healthy, and less than 1 indicates an issue with one of these components.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: INSTANCE_GROUP_NAME
      value: "{{match_resource.resource.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: GCP Compute Engine instance groups should have healthy members, functioning autoscaling, current OS patches, and acceptable utilization.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: compute_engine
    - name: scope
      value: Resource
    - name: access
      value: read-only
