apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Diagnoses GCP Compute Engine instance group health -- discovers instance groups and configurations, checks member health, autoscaling and capacity, OS patch compliance, and utilization, and generates a consolidated health summary for instance group {{match_resource.resource.name}} in project {{project.name}}.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-compute-instancegroup-health/runbook.robot
  intervalStrategy: intermezzo
  intervalSeconds: 3600
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: INSTANCE_GROUP_NAME
      value: "{{match_resource.resource.name}}"
    - name: PATCH_WARNING_DAYS
      value: '{{custom.patch_warning_days | default("30")}}'
    - name: UTILIZATION_LOW_THRESHOLD
      value: '{{custom.utilization_low_threshold | default("5")}}'
    - name: UTILIZATION_HIGH_THRESHOLD
      value: '{{custom.utilization_high_threshold | default("90")}}'
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
