apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/compute_engine/compute_engine.svg
  alias: "{{match_resource.resource.name}} Compute VM Health"
  asMeasuredBy: A combined 0-1 health score across uptime/operational status, OS patch status, disk utilization, network health, and guest/serial console health for standalone VM {{match_resource.resource.name}} in project {{project.name}}.
  configProvided:
  - name: GCP_PROJECT_ID
    value: "{{project.name}}"
  - name: VM_NAME
    value: "{{match_resource.resource.name}}"
  owners:
  - {{workspace.owner_email}}
  statement: Standalone Compute Engine VMs should be running, recently rebooted, fully patched, with healthy disks, network, and guest/serial console.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: compute_vm
    - name: category
      value: compute
    - name: access
      value: read-only
