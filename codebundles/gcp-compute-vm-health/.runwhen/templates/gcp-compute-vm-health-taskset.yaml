apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Debugs health of a standalone GCP Compute Engine VM -- checks uptime/operational status, OS patch status via OS Config, disk utilization, network health, and guest/serial console health.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-compute-vm-health/runbook.robot
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: VM_NAME
      value: "{{match_resource.resource.name}}"
    - name: UPTIME_WARNING_DAYS
      value: "90"
    - name: PATCH_WARNING_DAYS
      value: "30"
    - name: DISK_USAGE_THRESHOLD
      value: "85"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
