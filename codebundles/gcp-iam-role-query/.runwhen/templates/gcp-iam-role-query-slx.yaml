apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/iam/iam.svg
  alias: "{{match_resource.resource.name}} GCP IAM Role Query"
  asMeasuredBy: On-demand query results of GCP IAM role bindings for the project, its service accounts, resources, and services.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: Provides on-demand GCP IAM role and access querying driven by runtime variables.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: iam
    - name: category
      value: security
    - name: access
      value: read-only
