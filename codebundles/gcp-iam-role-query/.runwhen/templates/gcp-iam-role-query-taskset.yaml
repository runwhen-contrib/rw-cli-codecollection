apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Runs on-demand GCP IAM role and access queries for service accounts, resources, services, and the project.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-iam-role-query/runbook.robot
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: SERVICE_ACCOUNT
      value: "{{ custom.service_account | default('') }}"
    - name: RESOURCE_NAME
      value: "{{ custom.resource_name | default('') }}"
    - name: SERVICE_TYPE
      value: "{{ custom.service_type | default('') }}"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
