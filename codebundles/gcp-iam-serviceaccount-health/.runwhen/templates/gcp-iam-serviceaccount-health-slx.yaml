apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/identity_and_access_management/identity_and_access_management.svg
  alias: "{{project.name}} IAM Service Account Health"
  asMeasuredBy: A combined score of privileged role assignments, key rotation, key count, disabled service accounts in use, and IAM policy drift for GCP IAM service accounts. A score of 1 is healthy, less than 1 indicates issues.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: GCP IAM service accounts should have rotated keys, a minimal number of active keys, no privileged role assignments, no disabled accounts still in use, and clean IAM policy bindings.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: iam
    - name: category
      value: security
    - name: access
      value: read-only
