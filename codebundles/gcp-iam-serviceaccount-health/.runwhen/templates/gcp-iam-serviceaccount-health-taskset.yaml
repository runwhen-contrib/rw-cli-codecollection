apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Runs tasks to validate GCP IAM Service Account health including privileged role assignments, key rotation, key count, disabled service accounts in use, and IAM policy drift.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-iam-serviceaccount-health/runbook.robot
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  runtimeVarsProvided:
    - name: SERVICE_ACCOUNT
      default: ""
      description: Optional email of a single service account to scope checks to. Empty means all service accounts in the project.
      validation:
        type: regex
        pattern: ^[a-zA-Z0-9@.-]*$
    - name: KEY_ROTATION_DAYS
      default: "90"
      description: Maximum allowed age of a service account key in days before rotation is flagged.
      validation:
        type: regex
        pattern: ^\d+$
    - name: MAX_KEYS_PER_SA
      default: "5"
      description: Maximum allowed number of active keys per service account before it is flagged.
      validation:
        type: regex
        pattern: ^\d+$
    - name: PRIVILEGED_ROLES
      default: "roles/owner,roles/editor"
      description: Comma-separated list of roles considered high-privilege and worth flagging.
      validation:
        type: regex
        pattern: ^[a-zA-Z0-9/_,. -]+$
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
