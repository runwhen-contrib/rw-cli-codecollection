apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: OK
  displayUnitsShort: ok
  locations:
    - {{default_location}}
  description: Measures GCP project configuration health by scoring PERMISSION_DENIED activity, IAM policy changes, org policy constraint compliance, and audit log configuration.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gcp-project-configuration-audit/sli.robot
  intervalStrategy: intermezzo
  intervalSeconds: 600
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
    - name: LOOKBACK_WINDOW
      value: "{{custom.lookback_window | default('P7D')}}"
    - name: PERMISSION_DENIED_THRESHOLD
      value: "{{custom.permission_denied_threshold | default('10')}}"
    - name: ORG_ID
      value: "{{custom.org_id | default('')}}"
  secretsProvided:
  {% if wb_version %}
    {% include "gcp-auth.yaml" ignore missing %}
  {% else %}
    - name: gcp_credentials
      workspaceKey: {{custom.gcp_credentials_secret | default("gcp_credentials")}}
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m
