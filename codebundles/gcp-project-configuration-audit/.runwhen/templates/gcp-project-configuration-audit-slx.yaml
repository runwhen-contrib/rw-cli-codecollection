apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/gcp.svg
  alias: "{{project.name}} GCP Project Configuration Audit"
  asMeasuredBy: A combined score of PERMISSION_DENIED activity, IAM policy changes, org policy constraint compliance, and audit log configuration for the project. A score of 1 is healthy, less than 1 indicates configuration risks.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: GCP projects should have properly configured audit logging, no unexpected privileged IAM changes, no org policy constraint violations, and no elevated PERMISSION_DENIED activity.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: project
    - name: category
      value: security
    - name: access
      value: read-only
