apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/gcp/cloud_monitoring/cloud_monitoring.svg
  alias: "{{project.name}} GCP Project Quota Health"
  asMeasuredBy: A combined 0-1 health score of allocation quota usage, rate quota consumption, quotas above a warning threshold, and quota rejection events for the GCP project. A score of 1 is healthy; less than 1 indicates quota pressure.
  configProvided:
    - name: GCP_PROJECT_ID
      value: "{{project.name}}"
  owners:
    - {{workspace.owner_email}}
  statement: GCP project service quotas should stay within their limits and below the configured warning threshold, with no excessive quota rejection events.
  additionalContext:
    {% include "gcp-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "gcp-tags.yaml" ignore missing %}
    - name: service
      value: quota
    - name: category
      value: health
    - name: access
      value: read-only
    - name: scope
      value: project
