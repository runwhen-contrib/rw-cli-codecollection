apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  displayUnitsLong: Health Score
  displayUnitsShort: score
  description: Aggregated health score for GitHub repository operations — activity, issues, PRs, configuration, and releases.
  owners:
    - engineering
  tags:
    - service:github-repository-health
    - platform:github
    - type:health-monitoring
    - access:read-only