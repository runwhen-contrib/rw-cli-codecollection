apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: Comprehensive repository health monitoring across GitHub organizations — dormant repos, stale issues/PRs, branch hygiene, config health, release cadence, and contributor pulse.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/gh-repo-health/runbook.robot
  configProvided:
    - name: GITHUB_REPOS
      value: "{{match_resource.resource.name}}"
    - name: GITHUB_ORGS
      value: "{% if match_resource.resource_type == 'github_organization' %}{{match_resource.resource.name}}{% endif %}"
    - name: DORMANT_DAYS
      value: "90"
    - name: STALE_ISSUE_DAYS
      value: "60"
    - name: STALE_ISSUE_THRESHOLD
      value: "20"
    - name: STALE_PR_DAYS
      value: "14"
    - name: STALE_BRANCH_DAYS
      value: "60"
    - name: OVERDUE_COMMIT_THRESHOLD
      value: "30"
    - name: PULSE_DAYS
      value: "7"
    - name: MAX_REPOS_TO_ANALYZE
      value: "50"
    - name: MAX_REPOS_PER_ORG
      value: "20"
  secretsProvided:
  {% if wb_version %}
    - name: GITHUB_TOKEN
      workspaceKey: GITHUB_TOKEN
  {% else %}
    - name: GITHUB_TOKEN
      workspaceKey: AUTH DETAILS NOT FOUND
  {% endif %}
    - name: GITHUB_APP_ID
      workspaceKey: GITHUB_APP_ID
    - name: GITHUB_APP_INSTALLATION_ID
      workspaceKey: GITHUB_APP_INSTALLATION_ID
    - name: GITHUB_APP_CLIENT_ID
      workspaceKey: GITHUB_APP_CLIENT_ID
    - name: GITHUB_APP_PRIVATE_KEY
      workspaceKey: GITHUB_APP_PRIVATE_KEY