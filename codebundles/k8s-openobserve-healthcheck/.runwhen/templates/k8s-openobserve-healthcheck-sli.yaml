apiVersion: runwhen.com/v1
kind: ServiceLevelIndicator
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
    runwhen.com/sli: "true"
spec:
  displayUnitsLong: OK
  displayUnitsShort: ok
  locations:
    - {{default_location}}
  description: Aggregates OpenObserve API reachability, workload replica readiness, and storage health for {{match_resource.resource.metadata.name}}.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/k8s-openobserve-healthcheck/sli.robot
  intervalStrategy: intermezzo
  intervalSeconds: 300
  configProvided:
    - name: CONTEXT
      value: "{{context}}"
    - name: NAMESPACE
      value: "{{match_resource.resource.metadata.namespace}}"
    - name: OBJECT_NAME
      value: "{{match_resource.resource.metadata.name}}"
    - name: KUBERNETES_DISTRIBUTION_BINARY
      value: "{{custom.kubernetes_distribution_binary | default('kubectl')}}"
    - name: OPENOBSERVE_SERVICE_NAME
      value: ""
    - name: OPENOBSERVE_HTTP_PORT
      value: "5080"
    - name: OPENOBSERVE_LOCAL_PORT
      value: "5080"
    - name: OPENOBSERVE_ORGANIZATION
      value: "default"
    - name: OPENOBSERVE_BASE_URL
      value: ""
    - name: OPENOBSERVE_API_TIMEOUT
      value: "25"
    - name: STORAGE_S3_FAILURE_THRESHOLD
      value: "10"
  secretsProvided:
  {% if wb_version %}
    {% include "kubernetes-auth.yaml" ignore missing %}
  {% else %}
    - name: kubeconfig
      workspaceKey: {{custom.kubeconfig_secret_name | default("kubeconfig")}}
  {% endif %}
  alertConfig:
    tasks:
      persona: eager-edgar
      sessionTTL: 10m