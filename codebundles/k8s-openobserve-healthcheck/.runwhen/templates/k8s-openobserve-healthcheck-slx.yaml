apiVersion: runwhen.com/v1
kind: ServiceLevelX
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  imageURL: https://storage.googleapis.com/runwhen-nonprod-shared-images/icons/kubernetes/resources/labeled/ns.svg
  alias: OpenObserve Health Check for {{match_resource.resource.metadata.name}}
  asMeasuredBy: OpenObserve workload / Pod / API health and storage metrics in Kubernetes.
  configProvided:
    - name: OBJECT_NAME
      value: {{match_resource.resource.metadata.name}}
  owners:
    - {{workspace.owner_email}}
  statement: The OpenObserve deployment in the namespace should have ready replicas, stable Pods, a reachable HTTP API, and healthy storage/ingestion/cluster state.
  additionalContext:
    {% include "kubernetes-hierarchy.yaml" ignore missing %}
    qualified_name: "{{ match_resource.qualified_name }}"
  tags:
    {% include "kubernetes-tags.yaml" ignore missing %}
    - name: cloud
      value: kubernetes
    - name: service
      value: openobserve
    - name: scope
      value: project
    - name: access
      value: read-only