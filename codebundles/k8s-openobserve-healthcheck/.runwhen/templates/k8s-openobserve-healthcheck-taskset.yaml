apiVersion: runwhen.com/v1
kind: Runbook
metadata:
  name: {{slx_name}}
  labels:
    {% include "common-labels.yaml" %}
  annotations:
    {% include "common-annotations.yaml" %}
spec:
  location: {{default_location}}
  description: OpenObserve workload, Pod, API, storage, cluster, ingestion queue, and PVC health checks for {{match_resource.resource.metadata.name}} in namespace {{match_resource.resource.metadata.namespace}}.
  codeBundle:
    {% if repo_url %}
    repoUrl: {{repo_url}}
    {% else %}
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    {% endif %}
    {% if ref %}
    ref: {{ref}}
    {% else %}
    ref: main
    {% endif %}
    pathToRobot: codebundles/k8s-openobserve-healthcheck/runbook.robot
  configProvided:
    - name: CONTEXT
      value: "{{context}}"
    - name: NAMESPACE
      value: "{{match_resource.resource.metadata.namespace}}"
    - name: OBJECT_NAME
      value: "{{match_resource.resource.metadata.name}}"
    - name: KUBERNETES_DISTRIBUTION_BINARY
      value: "{{custom.kubernetes_distribution_binary | default('kubectl')}}"
    - name: OPENOBSERVE_SERVICE_NAME
      value: ""
    - name: OPENOBSERVE_HTTP_PORT
      value: "5080"
    - name: OPENOBSERVE_LOCAL_PORT
      value: "5080"
    - name: OPENOBSERVE_ORGANIZATION
      value: "default"
    - name: OPENOBSERVE_BASE_URL
      value: ""
    - name: OPENOBSERVE_API_TIMEOUT
      value: "25"
    - name: OPENOBSERVE_PF_WAIT_SECS
      value: "15"
    - name: OPENOBSERVE_CREDENTIAL_SECRET_NAME
      value: "{{custom.openobserve_credential_secret_name | default('')}}"
    - name: OPENOBSERVE_CREDENTIAL_USER_KEY
      value: ""
    - name: OPENOBSERVE_CREDENTIAL_PASSWORD_KEY
      value: ""
    - name: OPENOBSERVE_ALLOW_EXEC
      value: "false"
    - name: OPENOBSERVE_POD_RESTART_THRESHOLD
      value: "5"
    - name: STORAGE_S3_FAILURE_THRESHOLD
      value: "10"
    - name: INGESTION_QUEUE_KEY_THRESHOLD
      value: "100000"
    - name: CLUSTER_PENDING_JOBS_THRESHOLD
      value: "100"
    - name: PVC_USAGE_THRESHOLD_PERCENT
      value: "80"
  secretsProvided:
  {% if wb_version %}
    {% include "kubernetes-auth.yaml" ignore missing %}
  {% else %}
    - name: kubeconfig
      workspaceKey: {{custom.kubeconfig_secret_name | default("kubeconfig")}}
    - name: openobserve_credentials
      workspaceKey: {{custom.openobserve_credentials_secret_name | default("openobserve_credentials")}}
  {% endif %}