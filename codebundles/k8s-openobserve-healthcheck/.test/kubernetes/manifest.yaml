apiVersion: v1
kind: Namespace
metadata:
  name: test-openobserve-health

---
apiVersion: v1
kind: Secret
metadata:
  name: openobserve-credentials
  namespace: test-openobserve-health
type: Opaque
data:
  ROOT_USER_EMAIL: cm9vdEBleGFtcGxlLmNvbQ==
  ROOT_USER_PASSWORD: Q29tcGxleHBhc3MjMTIz

---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
  namespace: test-openobserve-health
  labels:
    app.kubernetes.io/name: openobserve
spec:
  type: ClusterIP
  ports:
    - port: 5080
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: openobserve

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: test-openobserve-health
  labels:
    app.kubernetes.io/name: openobserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openobserve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openobserve
    spec:
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: openobserve-credentials
          env:
            - name: ZO_LOCAL_MODE
              value: "true"
            - name: ZO_DATA_DIR
              value: /data
          ports:
            - containerPort: 5080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openobserve-data
  namespace: test-openobserve-health
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi